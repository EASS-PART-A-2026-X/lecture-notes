<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" role="img" aria-labelledby="t d" width="640" height="480">
  <title id="t">Scheduling: who uses the next free slot?</title>
  <desc id="d">Two slots serve A and B. A finishes after two steps, B after four. Fixed batching leaves A’s slot idle; continuous batching admits waiting request C into that slot.</desc>
  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M1 1 L9 5 L1 9 Z" fill="#3b4453" />
    </marker>
  </defs>
  <rect width="640" height="480" fill="#ffffff" />
  <g font-family="Helvetica, Arial, 'Liberation Sans', sans-serif">
    <text x="24" y="36" font-size="23" fill="#0f1e3a" text-anchor="start">Scheduling: who uses the next free slot?</text>
    <text x="24" y="78" font-size="16" fill="#0f1e3a" text-anchor="start">Each cell is one abstract generation step; equal step times</text>
    <text x="24" y="100" font-size="16" fill="#0f1e3a" text-anchor="start">are a teaching assumption, not a real serving prediction.</text>
    <text x="24" y="135" font-size="18" fill="#0f1e3a" text-anchor="start">Fixed batch: wait for B to finish</text>
    <text x="24" y="179" font-size="16" fill="#0f1e3a" text-anchor="start">Slot 1</text>
    <rect x="110" y="151" width="112" height="42" rx="6" fill="#eff6f6" stroke="#3b4453" stroke-width="2" />
    <text x="122" y="179" font-size="18" fill="#0f1e3a" text-anchor="start">A</text>
    <rect x="235" y="151" width="112" height="42" rx="6" fill="#eff6f6" stroke="#3b4453" stroke-width="2" />
    <text x="247" y="179" font-size="18" fill="#0f1e3a" text-anchor="start">A</text>
    <rect x="360" y="151" width="112" height="42" rx="6" fill="#f7f5ef" stroke="#3b4453" stroke-width="2" />
    <text x="372" y="179" font-size="18" fill="#0f1e3a" text-anchor="start">idle</text>
    <rect x="485" y="151" width="112" height="42" rx="6" fill="#f7f5ef" stroke="#3b4453" stroke-width="2" />
    <text x="497" y="179" font-size="18" fill="#0f1e3a" text-anchor="start">idle</text>
    <text x="24" y="229" font-size="16" fill="#0f1e3a" text-anchor="start">Slot 2</text>
    <rect x="110" y="201" width="112" height="42" rx="6" fill="#eff6f6" stroke="#3b4453" stroke-width="2" />
    <text x="122" y="229" font-size="18" fill="#0f1e3a" text-anchor="start">B</text>
    <rect x="235" y="201" width="112" height="42" rx="6" fill="#eff6f6" stroke="#3b4453" stroke-width="2" />
    <text x="247" y="229" font-size="18" fill="#0f1e3a" text-anchor="start">B</text>
    <rect x="360" y="201" width="112" height="42" rx="6" fill="#eff6f6" stroke="#3b4453" stroke-width="2" />
    <text x="372" y="229" font-size="18" fill="#0f1e3a" text-anchor="start">B</text>
    <rect x="485" y="201" width="112" height="42" rx="6" fill="#eff6f6" stroke="#3b4453" stroke-width="2" />
    <text x="497" y="229" font-size="18" fill="#0f1e3a" text-anchor="start">B</text>
    <text x="24" y="295" font-size="18" fill="#0f1e3a" text-anchor="start">Continuous batch: admit C when A finishes</text>
    <text x="24" y="339" font-size="16" fill="#0f1e3a" text-anchor="start">Slot 1</text>
    <rect x="110" y="311" width="112" height="42" rx="6" fill="#eff6f6" stroke="#3b4453" stroke-width="2" />
    <text x="122" y="339" font-size="18" fill="#0f1e3a" text-anchor="start">A</text>
    <rect x="235" y="311" width="112" height="42" rx="6" fill="#eff6f6" stroke="#3b4453" stroke-width="2" />
    <text x="247" y="339" font-size="18" fill="#0f1e3a" text-anchor="start">A</text>
    <rect x="360" y="311" width="112" height="42" rx="6" fill="#eff6f6" stroke="#3b4453" stroke-width="2" />
    <text x="372" y="339" font-size="18" fill="#0f1e3a" text-anchor="start">C</text>
    <rect x="485" y="311" width="112" height="42" rx="6" fill="#eff6f6" stroke="#3b4453" stroke-width="2" />
    <text x="497" y="339" font-size="18" fill="#0f1e3a" text-anchor="start">C</text>
    <text x="24" y="389" font-size="16" fill="#0f1e3a" text-anchor="start">Slot 2</text>
    <rect x="110" y="361" width="112" height="42" rx="6" fill="#eff6f6" stroke="#3b4453" stroke-width="2" />
    <text x="122" y="389" font-size="18" fill="#0f1e3a" text-anchor="start">B</text>
    <rect x="235" y="361" width="112" height="42" rx="6" fill="#eff6f6" stroke="#3b4453" stroke-width="2" />
    <text x="247" y="389" font-size="18" fill="#0f1e3a" text-anchor="start">B</text>
    <rect x="360" y="361" width="112" height="42" rx="6" fill="#eff6f6" stroke="#3b4453" stroke-width="2" />
    <text x="372" y="389" font-size="18" fill="#0f1e3a" text-anchor="start">B</text>
    <rect x="485" y="361" width="112" height="42" rx="6" fill="#eff6f6" stroke="#3b4453" stroke-width="2" />
    <text x="497" y="389" font-size="18" fill="#0f1e3a" text-anchor="start">B</text>
    <text x="24" y="450" font-size="16" fill="#0f1e3a" text-anchor="start">C must already be waiting and fit the memory budget.</text>
  </g>
</svg>
