<svg xmlns="http://www.w3.org/2000/svg" width="640" height="604" viewBox="0 0 640 604" role="img" aria-labelledby="title desc">
<title id="title">SDLC: follow the change and its evidence</title>
<desc id="desc">Need, acceptance criteria, design, implementation, verification, release and operation form a feedback loop. Failed checks return to implementation. Human ownership applies throughout.</desc>
<defs>
<marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L9 5 L1 9 Z" fill="#3b4453"/></marker>
<marker id="arrow-fail" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L9 5 L1 9 Z" fill="#9b2c2c"/></marker>
</defs>
<rect width="640" height="604" fill="#ffffff"/>
<g font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" fill="#0f1e3a">
<text x="24" y="40" font-size="22" font-weight="700">A change earns its way to delivery</text>
<text x="24" y="68" font-size="16" fill="#535c6b">People own the decisions. Tools help produce the evidence.</text>
<g fill="#f3f6fa" stroke="#1d4e89" stroke-width="2">
<rect x="24" y="124" width="276" height="84" rx="6"/><rect x="340" y="124" width="276" height="84" rx="6"/>
<rect x="340" y="264" width="276" height="84" rx="6"/><rect x="24" y="264" width="276" height="84" rx="6"/>
<rect x="24" y="404" width="276" height="84" rx="6"/><rect x="340" y="404" width="276" height="84" rx="6"/>
</g>
<g fill="#1d4e89">
<circle cx="52" cy="154" r="14"/><circle cx="368" cy="154" r="14"/>
<circle cx="368" cy="294" r="14"/><circle cx="52" cy="294" r="14"/>
<circle cx="52" cy="434" r="14"/><circle cx="368" cy="434" r="14"/>
</g>
<g font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">
<text x="52" y="160">1</text><text x="368" y="160">2</text>
<text x="368" y="300">3</text><text x="52" y="300">4</text>
<text x="52" y="440">5</text><text x="368" y="440">6</text>
</g>
<g font-size="18" font-weight="700">
<text x="76" y="160">Need → acceptance</text><text x="392" y="160">Design the boundary</text>
<text x="392" y="300">Implement a candidate</text><text x="76" y="300">Verify and review</text>
<text x="76" y="440">Release deliberately</text><text x="392" y="440">Operate and learn</text>
</g>
<g font-size="16">
<text x="40" y="192">Issue + observable examples</text><text x="356" y="192">API + data owner + tradeoffs</text>
<text x="356" y="332">Small diff + identified revision</text><text x="40" y="332">Tests + independent inspection</text>
<text x="40" y="472">Artifact + health + recovery</text><text x="356" y="472">Outcomes + traces + next need</text>
</g>
<g fill="none" stroke="#3b4453" stroke-width="2.5" marker-end="url(#arrow)">
<path d="M302 166 H337"/>
<path d="M478 210 V261"/>
<path d="M338 306 H303"/>
<path d="M162 350 V401"/>
<path d="M302 446 H337"/>
<path d="M618 446 H630 V104 H162 V121"/>
</g>
<text x="618" y="96" font-size="16" text-anchor="end">feeds the next need</text>
<path d="M250 350 V370 H410 V352" fill="none" stroke="#9b2c2c" stroke-width="2.5" stroke-dasharray="6 5" marker-end="url(#arrow-fail)"/>
<text x="330" y="392" font-size="16" fill="#9b2c2c" text-anchor="middle">failed check → repair</text>
<text x="24" y="530" font-size="18" font-weight="700">AI assistance can support every stage.</text>
<text x="24" y="556" font-size="16">Permissions, acceptance criteria and release gates still apply.</text>
<text x="24" y="582" font-size="16" fill="#535c6b">Repeat in small increments; stages can overlap.</text>
</g>
</svg>
