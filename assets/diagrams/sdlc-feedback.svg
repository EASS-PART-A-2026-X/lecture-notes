<svg xmlns="http://www.w3.org/2000/svg" width="640" height="520" viewBox="0 0 640 520" role="img" aria-labelledby="title desc">
<title id="title">SDLC: follow the change and its evidence</title><desc id="desc">Need, acceptance criteria, design, implementation, verification, release and operation form a feedback loop. Failed checks return to implementation. Human ownership applies throughout.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 8 4 0 8" fill="#1d4e89"/></marker></defs>
<rect width="640" height="520" rx="12" fill="#f7f5ef"/>
<g font-family="system-ui,sans-serif" fill="#0f1e3a">
<text x="28" y="35" font-size="21" font-weight="700">A change earns its way to delivery</text>
<text x="28" y="61" font-size="14">People own the decisions. Tools help produce the evidence.</text>
<g fill="white" stroke="#1d4e89" stroke-width="1.5">
<rect x="28" y="88" width="270" height="78" rx="8"/><rect x="342" y="88" width="270" height="78" rx="8"/>
<rect x="342" y="210" width="270" height="78" rx="8"/><rect x="28" y="210" width="270" height="78" rx="8"/>
<rect x="28" y="332" width="270" height="78" rx="8"/><rect x="342" y="332" width="270" height="78" rx="8"/>
</g>
<g font-size="17" font-weight="700"><text x="44" y="116">1 · Need → acceptance</text><text x="358" y="116">2 · Design the boundary</text><text x="358" y="238">3 · Implement a candidate</text><text x="44" y="238">4 · Verify and review</text><text x="44" y="360">5 · Release deliberately</text><text x="358" y="360">6 · Operate and learn</text></g>
<g font-size="14"><text x="44" y="144">Issue + observable examples</text><text x="358" y="144">API + data owner + tradeoffs</text><text x="358" y="266">Small diff + identified revision</text><text x="44" y="266">Tests + independent inspection</text><text x="44" y="388">Artifact + health + recovery</text><text x="358" y="388">Outcomes + traces + next need</text></g>
<g fill="none" stroke="#1d4e89" stroke-width="2" marker-end="url(#arrow)"><path d="M298 127H339"/><path d="M477 166V207"/><path d="M342 249H301"/><path d="M163 288V329"/><path d="M298 371H339"/><path d="M612 371H626V78H163V85"/><path d="M163 210V188H477V207" stroke-dasharray="5 4"/></g>
<text x="226" y="184" font-size="12" fill="#1d4e89">failed check → repair</text>
<text x="28" y="451" font-size="15" font-weight="700">AI assistance can support every stage.</text>
<text x="28" y="476" font-size="14">Permissions, acceptance criteria and release gates still apply.</text>
<text x="28" y="499" font-size="13" fill="#535c6b">Repeat in small increments; stages can overlap.</text>
</g></svg>
