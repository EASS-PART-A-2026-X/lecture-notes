<svg xmlns="http://www.w3.org/2000/svg" width="640" height="860" viewBox="0 0 640 860" role="img" aria-labelledby="data-title data-desc">
<title id="data-title">Training changes weights; a request uses them</title>
<desc id="data-desc">Curated training data passes through optimization to produce versioned weights. At runtime, a request and retrieved evidence enter the harness, inference reads those weights, and a candidate passes through backend validation and authorization before any commit. No arrow returns runtime context into training automatically.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#475569"/></marker></defs>
<rect width="640" height="860" fill="white"/>
<g font-family="Arial, Helvetica, sans-serif" fill="#17233c">
<rect x="12" y="20" width="616" height="200" rx="8" fill="#f2f4ff" stroke="#4051b5"/>
<text x="28" y="56" font-size="23" font-weight="bold">Training: deliberately update weights</text>
<g fill="white" stroke="#4051b5" stroke-width="2"><rect x="28" y="92" width="168" height="100" rx="5"/><rect x="236" y="92" width="168" height="100" rx="5"/><rect x="444" y="92" width="168" height="100" rx="5"/></g>
<g font-size="19" text-anchor="middle"><text x="112" y="129">Curated data</text><text x="112" y="157">and objectives</text><text x="320" y="129">Training /</text><text x="320" y="157">optimization</text><text x="528" y="129">Versioned</text><text x="528" y="157">model weights</text></g>
<g stroke="#475569" stroke-width="3" fill="none" marker-end="url(#arrow)"><path d="M196 142H232"/><path d="M404 142H440"/></g>
<text x="28" y="257" font-size="23" font-weight="bold">Runtime: use the current weights</text>
<g stroke-width="2"><rect x="120" y="280" width="400" height="76" rx="5" fill="#f8fafc" stroke="#64748b"/><rect x="120" y="398" width="400" height="76" rx="5" fill="#eef8f4" stroke="#167d65"/><rect x="120" y="516" width="400" height="76" rx="5" fill="#f2f4ff" stroke="#4051b5"/><rect x="120" y="634" width="400" height="76" rx="5" fill="#f8fafc" stroke="#64748b"/><rect x="120" y="752" width="400" height="76" rx="5" fill="#fff7e8" stroke="#a66b13"/></g>
<g font-size="20" text-anchor="middle"><text x="320" y="311">Request + retrieved evidence</text><text x="320" y="338">Context can be wrong or hostile</text><text x="320" y="429">Harness builds bounded context</text><text x="320" y="456">Tools and limits remain enforced</text><text x="320" y="547">Inference: prefill + decode</text><text x="320" y="574">Read weights; generate candidates</text><text x="320" y="665">Candidate final result</text><text x="320" y="692">A proposal, not permission</text><text x="320" y="783">Backend validates and authorizes</text><text x="320" y="810">Only accepted operations commit</text></g>
<g stroke="#475569" stroke-width="3" fill="none" marker-end="url(#arrow)"><path d="M320 356V392"/><path d="M320 474V510"/><path d="M320 592V628"/><path d="M320 710V746"/><path d="M528 192V232H600V554H526"/></g>
</g></svg>
