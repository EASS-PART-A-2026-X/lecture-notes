<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 520" role="img" aria-labelledby="t d">
  <title id="t">Where can injected text reach?</title>
  <desc id="d">Two designs for the same agent. Dashed red arrows show what text injected into a pasted recipe can steer. Design A, one process holds everything: the agent and its tools run in one process that holds the model API key, has an open network and can write your files. Injected text steers the agent, which can then send the key to an attacker's server and overwrite your files and repository. Design B, key outside and a restricted tool runner: the controller holds the model key, asks the model endpoint and receives proposals, and checks every tool call. Injected text can still steer the controller's prompt and therefore a tool call, but the tool runner has no network and no secrets and works on a copy of the workspace. Its route to the Internet is blocked. The worst it can produce is an exported proposed diff, which you review before anything is merged.</desc>
  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L9 5 L1 9 Z" fill="#3b4453"/></marker>
    <marker id="r" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L9 5 L1 9 Z" fill="#9b2c2c"/></marker>
  </defs>
  <rect width="640" height="520" fill="#ffffff"/>
  <g font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" fill="#0f1e3a">
    <text x="320" y="30" text-anchor="middle" font-size="22" font-weight="700">Where can injected text reach?</text>
    <text x="320" y="54" text-anchor="middle" font-size="16" fill="#535c6b">Dashed red arrows: what the injected text can steer</text>

    <!-- Design A -->
    <rect x="8" y="66" width="624" height="176" rx="6" fill="#f7f5ef" stroke="#ddd7ca" stroke-width="2"/>
    <text x="20" y="90" font-size="18" font-weight="700" fill="#9b2c2c">A · One process holds everything</text>
    <rect x="20" y="118" width="120" height="78" rx="6" fill="#fbf3f2" stroke="#9b2c2c" stroke-width="2"/>
    <text x="80" y="142" text-anchor="middle" font-size="16" font-weight="700">Pasted recipe</text>
    <text x="80" y="163" text-anchor="middle" font-size="16">with injected</text>
    <text x="80" y="183" text-anchor="middle" font-size="16">instructions</text>
    <rect x="196" y="100" width="216" height="134" rx="6" fill="#eff6f6" stroke="#22616b" stroke-width="2"/>
    <text x="304" y="122" text-anchor="middle" font-size="17" font-weight="700">Agent and its tools</text>
    <g fill="#ffffff" stroke="#3b4453" stroke-width="1.5">
      <rect x="210" y="132" width="188" height="27" rx="6"/>
      <rect x="210" y="166" width="188" height="27" rx="6"/>
      <rect x="210" y="200" width="188" height="27" rx="6"/>
    </g>
    <text x="304" y="151" text-anchor="middle" font-size="16">holds the model API key</text>
    <text x="304" y="185" text-anchor="middle" font-size="16">open network</text>
    <text x="304" y="219" text-anchor="middle" font-size="16">your files: writable</text>
    <rect x="500" y="110" width="124" height="54" rx="6" fill="#fbf3f2" stroke="#9b2c2c" stroke-width="2"/>
    <text x="562" y="133" text-anchor="middle" font-size="16" font-weight="700">Attacker's</text>
    <text x="562" y="153" text-anchor="middle" font-size="16" font-weight="700">server</text>
    <rect x="500" y="178" width="124" height="54" rx="6" fill="#fbf3f2" stroke="#9b2c2c" stroke-width="2"/>
    <text x="562" y="201" text-anchor="middle" font-size="16" font-weight="700">Your files</text>
    <text x="562" y="221" text-anchor="middle" font-size="16" font-weight="700">and repo</text>
    <g fill="none" stroke="#9b2c2c" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#r)">
      <path d="M140 157 H192"/>
      <path d="M412 137 H496"/>
      <path d="M412 205 H496"/>
    </g>
    <g font-size="16" fill="#9b2c2c" text-anchor="middle">
      <text x="168" y="148">steers</text>
      <text x="456" y="128">send key</text>
      <text x="456" y="196">overwrite</text>
    </g>

    <!-- Design B -->
    <rect x="8" y="254" width="624" height="258" rx="6" fill="#f7f5ef" stroke="#ddd7ca" stroke-width="2"/>
    <text x="20" y="278" font-size="18" font-weight="700" fill="#2a6a47">B · Key outside, restricted tool runner</text>
    <rect x="20" y="294" width="120" height="78" rx="6" fill="#fbf3f2" stroke="#9b2c2c" stroke-width="2"/>
    <text x="80" y="318" text-anchor="middle" font-size="16" font-weight="700">Pasted recipe</text>
    <text x="80" y="339" text-anchor="middle" font-size="16">with injected</text>
    <text x="80" y="359" text-anchor="middle" font-size="16">instructions</text>
    <rect x="196" y="292" width="204" height="82" rx="6" fill="#f3f6fa" stroke="#1d4e89" stroke-width="2"/>
    <text x="298" y="316" text-anchor="middle" font-size="17" font-weight="700">Controller</text>
    <text x="298" y="340" text-anchor="middle" font-size="16">holds the model key</text>
    <text x="298" y="362" text-anchor="middle" font-size="16">checks every tool call</text>
    <rect x="470" y="292" width="154" height="56" rx="6" fill="#eff6f6" stroke="#22616b" stroke-width="2"/>
    <text x="547" y="326" text-anchor="middle" font-size="17" font-weight="700">Model endpoint</text>
    <g fill="none" stroke="#3b4453" stroke-width="2.5" marker-end="url(#a)">
      <path d="M400 306 H466"/>
      <path d="M470 336 H404"/>
    </g>
    <text x="435" y="299" text-anchor="middle" font-size="16">ask</text>
    <text x="435" y="356" text-anchor="middle" font-size="16">propose</text>
    <rect x="196" y="414" width="204" height="82" rx="6" fill="#f1f7f3" stroke="#2a6a47" stroke-width="2"/>
    <text x="298" y="438" text-anchor="middle" font-size="17" font-weight="700">Tool runner</text>
    <text x="298" y="462" text-anchor="middle" font-size="16">no network, no secrets</text>
    <text x="298" y="484" text-anchor="middle" font-size="16">works on a copy</text>
    <rect x="470" y="428" width="154" height="56" rx="6" fill="#f7f5ef" stroke="#3b4453" stroke-width="2"/>
    <text x="547" y="451" text-anchor="middle" font-size="16" font-weight="700">Proposed diff</text>
    <text x="547" y="472" text-anchor="middle" font-size="16">you review it</text>
    <g fill="none" stroke="#9b2c2c" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#r)">
      <path d="M140 333 H192"/>
      <path d="M298 374 V410"/>
      <path d="M400 456 H466"/>
    </g>
    <path d="M196 470 H162" fill="none" stroke="#9b2c2c" stroke-width="2.5" stroke-dasharray="7 5"/>
    <path d="M158 456 V484" stroke="#9b2c2c" stroke-width="4"/>
    <g font-size="16" fill="#9b2c2c">
      <text x="168" y="324" text-anchor="middle">steers</text>
      <text x="306" y="398">tool call</text>
      <text x="435" y="447" text-anchor="middle">export</text>
      <text x="146" y="462" text-anchor="end" font-weight="700">blocked:</text>
      <text x="146" y="482" text-anchor="end">no network</text>
    </g>
  </g>
</svg>
