<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 656" role="img" aria-labelledby="title desc">
  <title id="title">A bounded path from work order to authorized delivery</title>
  <desc id="desc">A work order defines the outcome. Specification makes examples precise and a plan selects a small change. Implementation produces a candidate, then verification checks it. A failed check returns to implementation only within the repair budget. Passing checks lead to review, which can expose a gap and require new verification. Delivery requires separate authorization in trusted controls. At an exhausted budget or unresolved gate, retain evidence and stop.</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#475569" stroke-width="1.5"/></marker>
    <marker id="repair" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#a66b13" stroke-width="1.5"/></marker>
  </defs>
  <rect width="640" height="656" fill="#fff"/>
  <g font-family="Arial, Helvetica, sans-serif" fill="#172554" text-anchor="middle">
    <text x="320" y="30" font-size="21" font-weight="700">From request to a checked candidate</text>
    <text x="320" y="54" font-size="16" fill="#475569">Conceptual teaching map · read the numbered stages</text>
    <g fill="none" stroke="#475569" stroke-width="2.5" marker-end="url(#arrow)">
      <path d="M196 123 H232"/><path d="M404 123 H440"/>
      <path d="M528 166 V199 H152 V236"/>
      <path d="M276 290 H356"/>
      <path d="M570 344 V466"/>
      <path d="M360 508 H280"/>
    </g>
    <g fill="#f5f6ff" stroke="#4051b5" stroke-width="2">
      <rect x="28" y="80" width="168" height="86" rx="6"/>
      <rect x="236" y="80" width="168" height="86" rx="6"/>
      <rect x="444" y="80" width="168" height="86" rx="6"/>
      <rect x="28" y="240" width="248" height="104" rx="6"/>
    </g>
    <text x="112" y="109" font-size="19" font-weight="700">1. Work order</text>
    <text x="112" y="134" font-size="16">Outcome, limits,</text><text x="112" y="154" font-size="16">allowed effects</text>
    <text x="320" y="109" font-size="19" font-weight="700">2. Specification</text>
    <text x="320" y="134" font-size="16">Observable behavior</text><text x="320" y="154" font-size="16">and failure examples</text>
    <text x="528" y="109" font-size="19" font-weight="700">3. Plan</text>
    <text x="528" y="134" font-size="16">Small change,</text><text x="528" y="154" font-size="16">checks to run</text>
    <text x="152" y="273" font-size="21" font-weight="700">4. Implement</text>
    <text x="152" y="299" font-size="17">Bounded tools and workspace</text><text x="152" y="324" font-size="17">Produce an identified candidate</text>
    <rect x="360" y="240" width="252" height="104" rx="6" fill="#effaf6" stroke="#167d65" stroke-width="2"/>
    <text x="486" y="273" font-size="21" font-weight="700">5. Verify</text>
    <text x="486" y="299" font-size="17">Run checks on this revision</text><text x="486" y="324" font-size="17">Retain commands and results</text>
    <path d="M420 344 V383 H152 V348" fill="none" stroke="#a66b13" stroke-width="2.5" marker-end="url(#repair)"/>
    <text x="286" y="410" font-size="17" fill="#805010" font-weight="700">Fail → repair only within the budget</text>
    <text x="596" y="390" font-size="16" fill="#16614f" text-anchor="end">Pass</text>
    <path d="M28 442 H612" stroke="#475569" stroke-width="2" stroke-dasharray="6 5"/>
    <rect x="66" y="429" width="472" height="25" fill="#fff"/>
    <text x="302" y="447" font-size="17" fill="#475569">Delivery still requires trusted authorization</text>
    <g fill="#f8fafc" stroke="#475569" stroke-width="2">
      <rect x="360" y="470" width="252" height="82" rx="6"/>
      <rect x="28" y="470" width="248" height="82" rx="6"/>
    </g>
    <text x="486" y="501" font-size="21" font-weight="700">6. Review</text>
    <text x="486" y="528" font-size="17">Challenge the diff and evidence</text>
    <text x="152" y="501" font-size="21" font-weight="700">7. Deliver if authorized</text>
    <text x="152" y="528" font-size="17">Record the milestone reached</text>
    <rect x="28" y="581" width="584" height="58" rx="6" fill="#fffbeb" stroke="#a66b13" stroke-width="2"/>
    <text x="320" y="605" font-size="18" font-weight="700" fill="#805010">Budget exhausted or gate unresolved? Stop.</text>
    <text x="320" y="628" font-size="17" fill="#805010">Keep the candidate, failed result, and reason; do not bypass the gate.</text>
  </g>
</svg>
