<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 700" role="img" aria-labelledby="t d">
  <title id="t">A bounded path from work order to authorized delivery</title>
  <desc id="d">A work order is specified, the specification is turned into a plan, and an approved plan leads to stage 4, implement, which commits one identified candidate using bounded tools and a workspace. Stage 5, verify, runs checks on that revision. A failed check returns to implement only within the repair budget; when the budget is used up, the run stops. A pass leads to stage 6, review, which can find a gap: the gap returns to implement as a new candidate that must be verified again. A dashed line marks that delivery needs trusted authorization. If authorized, stage 7 delivers and records the milestone actually reached. If authorization is refused or a gap stays unresolved, the run stops. Stop means keep the candidate, the failed result and the reason. Legend: a solid amber arrow is repair within the budget; a dashed amber arrow is a return after review.</desc>
  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L9 5 L1 9 Z" fill="#3b4453"/></marker>
    <marker id="o" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L9 5 L1 9 Z" fill="#84540c"/></marker>
  </defs>
  <rect width="640" height="700" fill="#ffffff"/>
  <g font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" fill="#0f1e3a">
    <text x="320" y="32" text-anchor="middle" font-size="22" font-weight="700">From work order to authorized delivery</text>
    <text x="320" y="56" text-anchor="middle" font-size="16" fill="#535c6b">Conceptual teaching map · follow the numbered stages</text>

    <!-- Row 1 -->
    <g fill="#f3f6fa" stroke="#1d4e89" stroke-width="2">
      <rect x="16" y="76" width="162" height="80" rx="6"/>
      <rect x="238" y="76" width="162" height="80" rx="6"/>
      <rect x="462" y="76" width="162" height="80" rx="6"/>
    </g>
    <g text-anchor="middle">
      <text x="97" y="104" font-size="18" font-weight="700">1. Work order</text>
      <text x="97" y="128" font-size="16">outcome, limits,</text>
      <text x="97" y="148" font-size="16">allowed effects</text>
      <text x="319" y="104" font-size="18" font-weight="700">2. Specification</text>
      <text x="319" y="128" font-size="16">behavior and</text>
      <text x="319" y="148" font-size="16">failure examples</text>
      <text x="543" y="104" font-size="18" font-weight="700">3. Plan</text>
      <text x="543" y="128" font-size="16">small change,</text>
      <text x="543" y="148" font-size="16">checks to run</text>
    </g>

    <!-- Row 2 -->
    <rect x="40" y="216" width="256" height="96" rx="6" fill="#eff6f6" stroke="#22616b" stroke-width="2"/>
    <text x="168" y="245" text-anchor="middle" font-size="20" font-weight="700">4. Implement</text>
    <text x="168" y="271" text-anchor="middle" font-size="16">bounded tools and workspace</text>
    <text x="168" y="294" text-anchor="middle" font-size="16">commit one candidate</text>
    <rect x="344" y="216" width="280" height="96" rx="6" fill="#f1f7f3" stroke="#2a6a47" stroke-width="2"/>
    <text x="484" y="245" text-anchor="middle" font-size="20" font-weight="700">5. Verify</text>
    <text x="484" y="271" text-anchor="middle" font-size="16">run checks on this revision</text>
    <text x="484" y="294" text-anchor="middle" font-size="16">keep commands and results</text>

    <!-- Row 3 -->
    <rect x="344" y="404" width="280" height="80" rx="6" fill="#f3f6fa" stroke="#1d4e89" stroke-width="2"/>
    <text x="484" y="432" text-anchor="middle" font-size="20" font-weight="700">6. Review</text>
    <text x="484" y="456" text-anchor="middle" font-size="16">challenge the diff</text>
    <text x="484" y="476" text-anchor="middle" font-size="16">and the evidence</text>

    <!-- Authorization divider -->
    <path d="M16 518 H624" stroke="#535c6b" stroke-width="2" stroke-dasharray="7 5"/>
    <text x="40" y="542" font-size="16" fill="#535c6b">Delivery needs trusted authorization</text>

    <!-- Row 4 -->
    <rect x="40" y="568" width="220" height="82" rx="6" fill="#fbf6ec" stroke="#84540c" stroke-width="2"/>
    <text x="150" y="594" text-anchor="middle" font-size="19" font-weight="700" fill="#84540c">Stop</text>
    <text x="150" y="618" text-anchor="middle" font-size="16">keep the candidate,</text>
    <text x="150" y="638" text-anchor="middle" font-size="16">the result and reason</text>
    <rect x="440" y="560" width="184" height="80" rx="6" fill="#f1f7f3" stroke="#2a6a47" stroke-width="2"/>
    <text x="532" y="588" text-anchor="middle" font-size="19" font-weight="700">7. Deliver</text>
    <text x="532" y="612" text-anchor="middle" font-size="16">record the milestone</text>
    <text x="532" y="632" text-anchor="middle" font-size="16">actually reached</text>

    <!-- Main flow -->
    <g fill="none" stroke="#3b4453" stroke-width="2.5" marker-end="url(#a)">
      <path d="M178 116 H234"/>
      <path d="M400 116 H458"/>
      <path d="M543 156 V184 H168 V212"/>
      <path d="M296 264 H340"/>
      <path d="M560 312 V400"/>
      <path d="M540 484 V556"/>
      <path d="M392 484 V604 H264"/>
    </g>
    <g font-size="16" text-anchor="middle">
      <text x="208" y="108">specify</text>
      <text x="431" y="108">plan</text>
      <text x="356" y="177">approve the plan</text>
      <text x="320" y="256">check</text>
      <text x="328" y="596">refused</text>
    </g>
    <text x="552" y="362" text-anchor="end" font-size="17" font-weight="700" fill="#2a6a47">pass</text>
    <text x="548" y="546" font-size="16">authorize</text>

    <!-- Repair within budget (solid amber) -->
    <path d="M400 312 V344 H200 V316" fill="none" stroke="#84540c" stroke-width="2.5" marker-end="url(#o)"/>
    <text x="300" y="370" text-anchor="middle" font-size="17" font-weight="700" fill="#84540c">fail → repair, only within the budget</text>
    <!-- Budget used up -->
    <path d="M40 296 H24 V604 H36" fill="none" stroke="#84540c" stroke-width="2.5" marker-end="url(#o)"/>
    <text x="32" y="486" font-size="16" fill="#84540c">budget</text>
    <text x="32" y="506" font-size="16" fill="#84540c">used up</text>
    <!-- Review found a gap (dashed amber) -->
    <path d="M344 452 H110 V316" fill="none" stroke="#84540c" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#o)"/>
    <text x="122" y="414" font-size="16" fill="#84540c">gap found: new candidate,</text>
    <text x="122" y="434" font-size="16" fill="#84540c">then verify it again</text>

    <!-- Legend -->
    <path d="M16 680 H48" stroke="#84540c" stroke-width="2.5"/>
    <text x="56" y="685" font-size="16" fill="#535c6b">repair within the budget</text>
    <path d="M316 680 H348" stroke="#84540c" stroke-width="2.5" stroke-dasharray="7 5"/>
    <text x="356" y="685" font-size="16" fill="#535c6b">return after review</text>
  </g>
</svg>
