<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 500" role="img" aria-labelledby="t d">
  <title id="t">Three ways different models share long-document context</title>
  <desc id="d">Row 1 shows raw text re-prefill where Model A and Model B both spend full reading work on 64k tokens. Row 2 shows Stanford Plato's Key rotating and scaling tilted axes from Model A to upright axes in Model B with no training. Row 3 shows Ramp Labs Speculative Encoding using a 2.35B MoE translator so Model B starts almost immediately without re-reading raw text.</desc>
  <defs>
    <filter id="card-shadow" x="-4%" y="-6%" width="108%" height="116%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f1e3a" flood-opacity="0.07"/>
    </filter>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L8 4.5 L1 8 Z" fill="#3b4453"/></marker>
  </defs>
  <rect width="640" height="500" fill="#ffffff"/>
  <g font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" fill="#0f1e3a">
    <text x="320" y="30" text-anchor="middle" font-size="22" font-weight="700">Sharing context across different models</text>
    <text x="320" y="54" text-anchor="middle" font-size="15" fill="#535c6b">Same-model cache fails when two agents use different models.</text>

    <!-- Row 1: Raw Re-prefill -->
    <rect x="28" y="72" width="584" height="116" rx="8" fill="#fbf3f2" stroke="#9b2c2c" stroke-width="1.8" filter="url(#card-shadow)"/>
    <circle cx="50" cy="95" r="11" fill="#9b2c2c"/>
    <text x="50" y="99" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">1</text>
    <text x="69" y="100" font-size="17" font-weight="700" fill="#9b2c2c">Raw text re-prefill (slow baseline)</text>

    <rect x="46" y="114" width="206" height="38" rx="8" fill="#ffffff" stroke="#9b2c2c" stroke-width="1.5"/>
    <text x="149" y="138" text-anchor="middle" font-size="15" font-weight="600">Model A reads 64k</text>
    <path d="M252 133 H320" fill="none" stroke="#3b4453" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="286" y="124" text-anchor="middle" font-size="14" fill="#535c6b">text</text>
    <rect x="328" y="114" width="206" height="38" rx="8" fill="#ffffff" stroke="#9b2c2c" stroke-width="1.5"/>
    <text x="431" y="138" text-anchor="middle" font-size="15" font-weight="600">Model B reads 64k</text>
    <text x="46" y="174" font-size="14.5" fill="#535c6b">100% baseline accuracy · pays full reading time twice</text>

    <!-- Row 2: Plato's Key Geometry -->
    <rect x="28" y="202" width="584" height="138" rx="8" fill="#f3f6fa" stroke="#1d4e89" stroke-width="1.8" filter="url(#card-shadow)"/>
    <circle cx="50" cy="225" r="11" fill="#1d4e89"/>
    <text x="50" y="229" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">2</text>
    <text x="69" y="230" font-size="17" font-weight="700" fill="#1d4e89">Plato's Key (why sharing works)</text>

    <!-- Tilted Axis A -->
    <line x1="88" y1="304" x2="146" y2="288" stroke="#1d4e89" stroke-width="2" stroke-linecap="round"/>
    <line x1="88" y1="304" x2="104" y2="250" stroke="#1d4e89" stroke-width="2" stroke-linecap="round"/>
    <circle cx="132" cy="270" r="5" fill="#1d4e89"/>
    <text x="115" y="324" text-anchor="middle" font-size="14.5" font-weight="600" fill="#535c6b">Model A</text>

    <!-- Rotate Arrow (ample clearance above curve) -->
    <path d="M156 282 Q 214 256 272 282" fill="none" stroke="#3b4453" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="214" y="254" text-anchor="middle" font-size="14.5" font-weight="600" fill="#3b4453">rotate</text>

    <!-- Upright Axis B -->
    <line x1="292" y1="304" x2="354" y2="304" stroke="#1d4e89" stroke-width="2" stroke-linecap="round"/>
    <line x1="292" y1="304" x2="292" y2="248" stroke="#1d4e89" stroke-width="2" stroke-linecap="round"/>
    <circle cx="336" cy="266" r="5" fill="#1d4e89"/>
    <text x="322" y="324" text-anchor="middle" font-size="14.5" font-weight="600" fill="#535c6b">Model B</text>

    <!-- Explanation Callout Card -->
    <rect x="378" y="246" width="216" height="80" rx="8" fill="#ffffff" stroke="#c9d7ea" stroke-width="1.4"/>
    <text x="392" y="269" font-size="15" font-weight="700" fill="#1d4e89">Closed-form alignment</text>
    <text x="392" y="292" font-size="14.5">Zero training needed</text>
    <text x="392" y="314" font-size="14" fill="#535c6b">~99% A &#x2192; B &#x2192; C chaining</text>

    <!-- Row 3: Speculative Encoding -->
    <rect x="28" y="354" width="584" height="126" rx="8" fill="#eff6f6" stroke="#22616b" stroke-width="1.8" filter="url(#card-shadow)"/>
    <circle cx="50" cy="377" r="11" fill="#22616b"/>
    <text x="50" y="381" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">3</text>
    <text x="69" y="382" font-size="17" font-weight="700" fill="#22616b">Speculative Encoding (fast serving)</text>

    <rect x="46" y="398" width="164" height="38" rx="8" fill="#ffffff" stroke="#22616b" stroke-width="1.5"/>
    <text x="128" y="422" text-anchor="middle" font-size="15" font-weight="600">A reads once</text>
    <path d="M210 417 H248" fill="none" stroke="#3b4453" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="254" y="398" width="146" height="38" rx="8" fill="#ffffff" stroke="#22616b" stroke-width="1.5"/>
    <text x="327" y="422" text-anchor="middle" font-size="15" font-weight="600">2.35B MoE</text>
    <path d="M400 417 H438" fill="none" stroke="#3b4453" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="444" y="398" width="150" height="38" rx="8" fill="#ffffff" stroke="#2a6a47" stroke-width="1.6"/>
    <text x="519" y="422" text-anchor="middle" font-size="15" font-weight="700" fill="#2a6a47">B ready fast</text>
    <text x="46" y="462" font-size="14.5" fill="#535c6b">Up to 7.5&#xD7; faster · check accuracy over hops</text>
  </g>
</svg>
