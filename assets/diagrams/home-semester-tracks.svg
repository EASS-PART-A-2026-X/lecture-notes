<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 466" role="img" aria-labelledby="t d">
  <title id="t">The semester on one page: product, deadlines and open source</title>
  <desc id="d">Thirteen Monday meetings from 19 October 2026 to 11 January 2027. Product lane: backend in meetings 1 to 3, frontend in 4 and 5, AI service in 6 and 7, Compose, evaluations and CI in 8 to 10, then clinics and the final demo in 11 to 13. Deadlines: EX1 due at meeting 4 (9 November), EX2 at meeting 7 (30 November), EX3 at meeting 13 (11 January). Open-source lane: two or three candidates at meeting 1, upstream PRs opened by meetings 3, 6 and 8, follow-ups every week, and three merged PRs with evidence due at meeting 13. Opened PRs are checkpoints; only merged PRs count.</desc>
