<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 800" role="img" aria-labelledby="t d">
<title id="t">One create request and its commit boundary</title>
<desc id="d">The happy path of POST /recipes/from-text inside the backend runs top to bottom in five steps, and the first three steps each have an early exit on the left. Step 1, validate the request body: empty text is rejected with 422, no AI call is made and no recipe is written. Step 2, request an AI candidate with POST /extract: if the AI service cannot be reached the backend answers 503 AI service unavailable and no recipe is written. Step 3, check the candidate against the contract: invalid output gives 502 and no recipe is written. A horizontal line marks session.commit(), the persistence boundary: above it no recipe row exists; below it the row is durable. Step 4 commits the transaction with save(): add, commit, refresh. Step 5 replies 201 Created with the stored recipe and its id. If that reply is lost after the commit, the row still exists but the caller cannot tell, so check GET /recipes before repeating the POST.</desc>
<defs>
<marker id="an" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L9 5 L1 9 Z" fill="#1d4e89"/></marker>
<marker id="ar" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L9 5 L1 9 Z" fill="#9b2c2c"/></marker>
<marker id="ao" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L9 5 L1 9 Z" fill="#84540c"/></marker>
</defs>
<rect width="640" height="800" fill="#ffffff"/>
<g font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" fill="#0f1e3a" text-anchor="middle">
<text x="320" y="32" font-size="21" font-weight="700">One create request and its commit boundary</text>
<text x="320" y="56" font-size="16" fill="#535c6b">POST /recipes/from-text, inside the backend. Time runs down.</text>
<text x="94" y="90" font-size="16" font-weight="700" fill="#9b2c2c">Early exit</text>
<text x="430" y="90" font-size="16" font-weight="700" fill="#1d4e89">Happy path</text>

<!-- happy path boxes 1-3 -->
<g fill="#f3f6fa" stroke="#1d4e89" stroke-width="2">
<rect x="240" y="100" width="380" height="84" rx="6"/>
<rect x="240" y="214" width="380" height="84" rx="6"/>
<rect x="240" y="328" width="380" height="84" rx="6"/>
</g>
<text x="430" y="134" font-size="19" font-weight="700">1. Validate the request body</text>
<text x="430" y="162" font-size="16">FromTextRequest: empty text fails</text>
<text x="430" y="248" font-size="19" font-weight="700">2. Request an AI candidate</text>
<text x="430" y="276" font-size="16">ai.extract_recipe(): POST /extract</text>
<text x="430" y="362" font-size="19" font-weight="700">3. Check the candidate</text>
<text x="430" y="390" font-size="16">contract shape and rules; still no write</text>

<!-- early exits -->
<g fill="#fbf3f2" stroke="#9b2c2c" stroke-width="2">
<rect x="16" y="100" width="160" height="84" rx="6"/>
<rect x="16" y="214" width="160" height="84" rx="6"/>
<rect x="16" y="328" width="160" height="84" rx="6"/>
</g>
<g font-size="16">
<text x="96" y="127" font-size="21" font-weight="700" fill="#9b2c2c">422</text>
<text x="96" y="150">no AI call</text>
<text x="96" y="172">no recipe written</text>
<text x="96" y="241" font-size="21" font-weight="700" fill="#9b2c2c">503</text>
<text x="96" y="264">AI unavailable</text>
<text x="96" y="286">no recipe written</text>
<text x="96" y="355" font-size="21" font-weight="700" fill="#9b2c2c">502</text>
<text x="96" y="378">invalid output</text>
<text x="96" y="400">no recipe written</text>
</g>
<g fill="none" stroke="#9b2c2c" stroke-width="2.5" marker-end="url(#ar)">
<path d="M238 150 H180"/>
<path d="M238 264 H180"/>
<path d="M238 378 H180"/>
</g>
<g font-size="16" fill="#9b2c2c">
<text x="208" y="140">reject</text>
<text x="208" y="254">raise</text>
<text x="208" y="368">raise</text>
</g>

<!-- happy path arrows -->
<g fill="none" stroke="#1d4e89" stroke-width="2.5" marker-end="url(#an)">
<path d="M430 184 V212"/>
<path d="M430 298 V326"/>
<path d="M430 412 V498"/>
<path d="M430 584 V612"/>
</g>
<g font-size="16" fill="#1d4e89" text-anchor="start">
<text x="442" y="204">passes</text>
<text x="442" y="318">returns JSON</text>
<text x="442" y="434">save(...)</text>
<text x="442" y="604">returns</text>
</g>

<!-- commit boundary -->
<path d="M16 458 H624" stroke="#2a6a47" stroke-width="3" stroke-dasharray="10 6"/>
<rect x="330" y="442" width="200" height="32" rx="6" fill="#ffffff" stroke="#2a6a47" stroke-width="2"/>
<text x="430" y="464" font-size="17" font-weight="700" fill="#2a6a47">session.commit()</text>
<g font-size="16" text-anchor="start">
<text x="24" y="446">Above: no recipe row yet</text>
<text x="24" y="482" font-weight="700" fill="#2a6a47">Below: the row is durable</text>
</g>

<!-- commit and reply -->
<rect x="240" y="500" width="380" height="84" rx="6" fill="#f1f7f3" stroke="#2a6a47" stroke-width="2"/>
<text x="430" y="534" font-size="19" font-weight="700">4. Commit the transaction</text>
<text x="430" y="562" font-size="16">save(): add, commit, refresh</text>
<rect x="240" y="614" width="380" height="84" rx="6" fill="#f3f6fa" stroke="#1d4e89" stroke-width="2"/>
<text x="430" y="648" font-size="19" font-weight="700">5. Reply 201 Created</text>
<text x="430" y="676" font-size="16">the stored recipe, with its new id</text>

<!-- lost reply -->
<path d="M430 698 V726" fill="none" stroke="#84540c" stroke-width="2.5" marker-end="url(#ao)"/>
<text x="442" y="718" font-size="16" fill="#84540c" text-anchor="start">reply lost?</text>
<rect x="16" y="728" width="608" height="66" rx="6" fill="#fbf6ec" stroke="#84540c" stroke-width="2"/>
<text x="320" y="754" font-size="18" font-weight="700" fill="#84540c">Reply lost after the commit? The row still exists.</text>
<text x="320" y="781" font-size="16">The caller cannot tell. Check GET /recipes before repeating the POST.</text>
</g>
</svg>
