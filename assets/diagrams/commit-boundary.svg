<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 800" role="img" aria-labelledby="title desc">
<title id="title">One request and the database commit boundary</title>
<desc id="desc">Validate user input, request a candidate from the AI service, and validate that candidate before a database write. Then commit the backend transaction and return success. Failure before commit leaves no new recipe in this flow. A lost reply after commit leaves an unknown outcome for the caller; blindly repeating create can duplicate it.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#334155" stroke-width="1.5"/></marker></defs>
<rect width="640" height="800" fill="#fff"/>
<g font-family="Arial, Helvetica, sans-serif" fill="#172554" text-anchor="middle">
<g fill="none" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"><path d="M320 120 V160"/><path d="M320 250 V290"/><path d="M320 380 V485"/><path d="M320 575 V615"/></g>
<g fill="#f5f3ff" stroke="#6d28d9" stroke-width="2"><rect x="90" y="30" width="460" height="90" rx="8"/><rect x="90" y="160" width="460" height="90" rx="8"/><rect x="90" y="290" width="460" height="90" rx="8"/></g>
<text x="320" y="66" font-size="24" font-weight="700">1. Validate user input</text><text x="320" y="98" font-size="20">Reject invalid input before a dependency call</text>
<text x="320" y="196" font-size="24" font-weight="700">2. Request an AI candidate</text><text x="320" y="228" font-size="20">Bound tools, requests, time, and output</text>
<text x="320" y="326" font-size="24" font-weight="700">3. Validate the candidate</text><text x="320" y="358" font-size="20">Shape plus business rules; still no recipe write</text>
<path d="M45 434 H595" stroke="#047857" stroke-width="3" stroke-dasharray="8 6"/>
<rect x="145" y="417" width="350" height="34" fill="#fff"/><text x="320" y="441" font-size="20" fill="#065f46" font-weight="700">Commit is the persistence boundary</text>
<rect x="90" y="485" width="460" height="90" rx="8" fill="#ecfdf5" stroke="#047857" stroke-width="2"/><text x="320" y="521" font-size="24" font-weight="700">4. Commit backend transaction</text><text x="320" y="553" font-size="20">The database owns the accepted record</text>
<rect x="90" y="615" width="460" height="72" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/><text x="320" y="659" font-size="24" font-weight="700">5. Return 201 with the stored record</text>
<rect x="45" y="715" width="550" height="65" rx="6" fill="#fff7ed" stroke="#9a3412" stroke-width="2"/><text x="320" y="742" font-size="20" fill="#7c2d12">Reply lost after commit? The caller cannot infer failure.</text><text x="320" y="768" font-size="20" fill="#7c2d12">Do not blindly repeat a state-changing request.</text>
</g></svg>
