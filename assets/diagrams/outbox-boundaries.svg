<svg xmlns="http://www.w3.org/2000/svg" width="760" height="690" viewBox="0 0 760 690" role="img" aria-labelledby="title description">
<title id="title">One atomic intent, separate delivery commits</title>
<desc id="description">The producer commits a recipe, replay record and outbox event together. A relay reads that committed event and sends it to a consumer. The consumer commits a notification row keyed by the event ID. If the acknowledgement is lost, the relay may deliver the same event again; the existing consumer event ID prevents another local effect. Producer and consumer commits are separate transactions.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#344563"/></marker></defs>
<rect width="760" height="690" fill="white"/>
<g font-family="Arial, Helvetica, sans-serif" fill="#17243e">
<text x="24" y="35" font-size="24" font-weight="700">Where atomicity ends</text>
<text x="24" y="63" font-size="16">An outbox preserves intent; delivery still has a failure window.</text>
<rect x="24" y="88" width="712" height="171" rx="5" fill="#f7f5ef" stroke="#d6d0c5"/>
<text x="40" y="116" font-size="19" font-weight="700">Producer SQLite file: one transaction</text>
<g fill="white" stroke="#344563" stroke-width="1.5"><rect x="40" y="138" width="207" height="72" rx="4"/><rect x="276" y="138" width="207" height="72" rx="4"/><rect x="512" y="138" width="207" height="72" rx="4"/></g>
<g text-anchor="middle" font-size="17"><text x="143" y="167">Recipe row</text><text x="143" y="192" font-size="15">the requested change</text><text x="379" y="167">Replay record</text><text x="379" y="192" font-size="15">owner + key → result</text><text x="615" y="167">Outbox event E</text><text x="615" y="192" font-size="15">stable UUID + recipe ID</text></g>
<text x="40" y="240" font-size="16" fill="#24614d">COMMIT makes all three visible; ROLLBACK leaves none.</text>
<path d="M615 259V287H184V340" fill="none" stroke="#344563" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="24" y="350" width="320" height="151" rx="5" fill="#f7f5ef" stroke="#d6d0c5"/>
<rect x="432" y="350" width="304" height="151" rx="5" fill="#f7f5ef" stroke="#d6d0c5"/>
<text x="40" y="379" font-size="19" font-weight="700">Relay (a function in this lab)</text>
<text x="40" y="407" font-size="16">Read a committed pending event.</text><text x="40" y="434" font-size="16">After success, mark it dispatched.</text><text x="40" y="480" font-size="15">Producer restart can retry event E.</text>
<text x="448" y="379" font-size="19" font-weight="700">Consumer SQLite file</text>
<text x="448" y="407" font-size="16">notification(E, recipe ID)</text><text x="448" y="434" font-size="16">Unique E identifies the local effect.</text><text x="448" y="480" font-size="15">Commit before acknowledging.</text>
<path d="M344 405H426" fill="none" stroke="#344563" stroke-width="2" marker-end="url(#arrow)"/>
<text x="355" y="393" font-size="14">event E</text>
<path d="M432 458H351" fill="none" stroke="#8c3034" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
<text x="366" y="449" font-size="14">ack</text>
<rect x="24" y="524" width="712" height="109" rx="5" fill="#fff5f4" stroke="#8c3034"/>
<text x="40" y="552" font-size="18" font-weight="700" fill="#8c3034">Lost acknowledgement: the consumer has already committed.</text>
<text x="40" y="580" font-size="16">The relay sends E again. The consumer sees E and reports “duplicate”.</text>
<text x="40" y="608" font-size="16">No new local notification row; the producer can now record delivery.</text>
<text x="24" y="664" font-size="16">Two local transactions. No claim of globally exactly-once execution.</text>
</g></svg>
