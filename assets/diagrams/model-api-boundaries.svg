<svg xmlns="http://www.w3.org/2000/svg" width="640" height="650" viewBox="0 0 640 650" role="img" aria-labelledby="api-title api-desc">
<title id="api-title">One application API, one configured model route</title>
<desc id="api-desc">The backend calls the AI service's application contract. Inside that service, Pydantic AI and schemas use one configured provider adapter. The alternatives are OpenAI Responses, Claude Messages and a compatible local server. Responses return through the adapter for validation. Only the backend owns persistence.</desc>
<defs><marker id="api-arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#3b4453" stroke-width="1.5"/></marker></defs>
<rect width="640" height="650" fill="#fff"/>
<g font-family="Helvetica, Arial, sans-serif" fill="#0f1e3a">
<text x="24" y="34" font-size="21" font-weight="700">One application API, one configured model route</text>
<rect x="24" y="58" width="592" height="66" rx="6" fill="#f7f5ef" stroke="#3b4453"/>
<text x="42" y="86" font-size="20" font-weight="700">Browser → backend</text>
<text x="42" y="111" font-size="17">Backend validates accepted data and owns persistence.</text>
