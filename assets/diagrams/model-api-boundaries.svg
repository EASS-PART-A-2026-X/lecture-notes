<text x="42" y="273" font-size="18">Pydantic AI loop + application schemas + limits</text>
<text x="42" y="300" font-size="17">Choose one configured adapter for the run:</text>
<rect x="42" y="320" width="168" height="58" rx="5" fill="#fff" stroke="#22616b"/>
<rect x="236" y="320" width="168" height="58" rx="5" fill="#fff" stroke="#22616b"/>
<rect x="430" y="320" width="168" height="58" rx="5" fill="#fff" stroke="#22616b"/>
<text x="126" y="344" font-size="18" text-anchor="middle" font-weight="700">OpenAI adapter</text>
