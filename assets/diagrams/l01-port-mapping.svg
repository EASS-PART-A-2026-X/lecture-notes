<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 520" role="img" aria-labelledby="t d">
<title id="t">How curl localhost:8080 reaches a container</title>
<desc id="d">Top: on the laptop, curl connects to 127.0.0.1:8080, where Docker listens for this laptop only. The option -p 127.0.0.1:8080:8000 forwards the connection into a Linux VM run by Docker Desktop (on Linux, the host itself) and on to port 8000 of the container, which has its own network and its own localhost. A server bound to 0.0.0.0:8000 answers 200 OK. A server bound to 127.0.0.1:8000 accepts only connections from inside the container, so the forwarded request gets no reply (curl error 52 on Docker Desktop). Bottom: the lifecycle of one container. docker run creates and starts a container from an image; it runs until its process exits or docker stop; an exited container is listed by docker ps -a until docker rm, or --rm, removes it. The image stays and is listed by docker images.</desc>
<defs>
<marker id="an" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L9 5 L1 9 Z" fill="#1d4e89"/></marker>
<marker id="ag" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L9 5 L1 9 Z" fill="#2a6a47"/></marker>
<marker id="ax" markerWidth="12" markerHeight="16" refX="6" refY="8" orient="auto" markerUnits="userSpaceOnUse"><path d="M6 1 V15" stroke="#9b2c2c" stroke-width="3"/></marker>
<marker id="ak" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L9 5 L1 9 Z" fill="#3b4453"/></marker>
</defs>
