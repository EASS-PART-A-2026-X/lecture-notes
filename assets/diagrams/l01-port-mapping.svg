<text x="495" y="103" text-anchor="middle" font-size="18" font-weight="700">127.0.0.1:8080</text>
<text x="495" y="126" text-anchor="middle" font-size="16" fill="#535c6b">Docker listens, laptop only</text>
<path d="M258 107 H366" stroke="#1d4e89" stroke-width="2.5" marker-end="url(#an)"/>
<text x="314" y="98" text-anchor="middle" font-size="16" font-weight="700" fill="#1d4e89">connects</text>
<rect x="22" y="166" width="596" height="168" rx="6" fill="#ffffff" stroke="#3b4453" stroke-width="2" stroke-dasharray="7 5"/>
<text x="36" y="188" font-size="16" fill="#535c6b">Linux VM run by Docker Desktop (on Linux: the host itself)</text>
<rect x="36" y="198" width="568" height="128" rx="6" fill="#f3f6fa" stroke="#1d4e89" stroke-width="2"/>
<text x="50" y="221" font-size="17" font-weight="700">Container hello: its own network and its own localhost</text>
<rect x="50" y="232" width="474" height="42" rx="6" fill="#f1f7f3" stroke="#2a6a47" stroke-width="2"/>
<text x="64" y="259" font-size="17" font-weight="700">server bound to 0.0.0.0:8000</text>
<text x="512" y="259" text-anchor="end" font-size="17" font-weight="700" fill="#2a6a47">answers 200 OK</text>
<rect x="50" y="280" width="474" height="42" rx="6" fill="#fbf3f2" stroke="#9b2c2c" stroke-width="2"/>
<text x="64" y="307" font-size="17" font-weight="700">server bound to 127.0.0.1:8000</text>
<text x="512" y="307" text-anchor="end" font-size="17" font-weight="700" fill="#9b2c2c">no reply (curl 52)</text>
<path d="M576 136 V253" stroke="#1d4e89" stroke-width="2.5" fill="none"/>
<path d="M576 253 H530" stroke="#2a6a47" stroke-width="2.5" marker-end="url(#ag)"/>
<path d="M576 253 V301 H530" stroke="#9b2c2c" stroke-width="2.5" stroke-dasharray="6 4" fill="none" marker-end="url(#ax)"/>
<text x="566" y="157" text-anchor="end" font-size="17" font-weight="700" fill="#1d4e89" stroke="#f7f5ef" stroke-width="6" stroke-linejoin="round" paint-order="stroke">-p 127.0.0.1:8080:8000 forwards to port 8000</text>
<rect x="8" y="356" width="624" height="156" rx="6" fill="#ffffff" stroke="#ddd7ca" stroke-width="2"/>
<text x="22" y="379" font-size="16" font-weight="700" fill="#535c6b">LIFECYCLE OF ONE CONTAINER</text>
<text x="618" y="379" text-anchor="end" font-size="16" font-weight="700" fill="#1d4e89">docker run = create + start</text>
