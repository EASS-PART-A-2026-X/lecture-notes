<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 500" role="img" aria-labelledby="title desc">
<title id="title">A token threshold is checked against observed usage</title>
<desc id="desc">An illustrative run has already reported 18,500 tokens, below a 20,000-token threshold. The next response reports another 3,000, bringing the total to 21,500. The token-limit check raises after receiving this response; it cannot undo tokens already processed. This counter example makes no model call and is not a bill or a hard spending ceiling.</desc>
<rect width="640" height="500" fill="#fff"/>
<g font-family="Arial, Helvetica, sans-serif" fill="#172554">
  <text x="320" y="30" text-anchor="middle" font-size="21" font-weight="700">One response can cross a token threshold</text>
  <text x="320" y="57" text-anchor="middle" font-size="17" fill="#475569">Illustrative usage counters · no model or provider call</text>
  <text x="48" y="102" font-size="19" font-weight="700">Before: 18,500 reported tokens</text>
  <g fill="#eef2f6"><rect x="48" y="120" width="544" height="32" rx="3"/><rect x="48" y="242" width="544" height="32" rx="3"/></g>
  <g fill="#4051b5"><rect x="48" y="120" width="402.56" height="32"/><rect x="48" y="242" width="402.56" height="32"/></g>
  <rect x="450.56" y="242" width="65.28" height="32" fill="#a66b13"/>
  <path d="M483.2 112 V292" stroke="#475569" stroke-width="2" stroke-dasharray="5 4"/>
  <rect x="412" y="170" width="198" height="30" fill="#fff"/>
  <text x="600" y="191" text-anchor="end" font-size="17" fill="#475569">20,000-token threshold</text>
  <text x="48" y="224" font-size="19" font-weight="700">After response: 18,500 + 3,000 = 21,500</text>
  <rect x="48" y="303" width="14" height="14" fill="#4051b5"/><text x="70" y="316" font-size="16">Earlier reported usage</text>
  <rect x="330" y="303" width="14" height="14" fill="#a66b13"/><text x="352" y="316" font-size="16">New response's usage</text>
  <rect x="28" y="349" width="584" height="126" rx="6" fill="#fffbeb" stroke="#a66b13" stroke-width="2"/>
  <g text-anchor="middle"><text x="320" y="379" font-size="21" font-weight="700" fill="#805010">The check raises after the response.</text><text x="320" y="408" font-size="18">UsageLimitExceeded stops the run.</text><text x="320" y="435" font-size="18">It does not undo tokens already processed.</text><text x="320" y="460" font-size="17" fill="#475569">Combine application limits with provider controls and measured usage.</text></g>
</g>
</svg>
