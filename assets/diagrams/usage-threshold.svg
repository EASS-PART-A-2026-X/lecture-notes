<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 600" role="img" aria-labelledby="title desc">
  <title id="title">A token threshold is checked against observed usage</title>
  <desc id="desc">On a scale from 0 to 25,000 tokens, an illustrative run has already reported 18,500 tokens, below a 20,000-token threshold. The next response reports another 3,000, bringing the total to 21,500. In time order: the request is sent and the check before it passes; the provider processes the request; the response reports its usage; then check_tokens raises UsageLimitExceeded. It cannot undo tokens already processed. This counter example makes no model call and is not a bill or a hard spending ceiling.</desc>
  <defs>
    <marker id="ah" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0 0 L11 6 L0 12 Z" fill="#3b4453"/>
    </marker>
  </defs>
  <rect width="640" height="600" fill="#ffffff"/>
  <g font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" fill="#0f1e3a">
    <text x="320" y="32" text-anchor="middle" font-size="21" font-weight="700">One response can cross a token threshold</text>
    <text x="320" y="58" text-anchor="middle" font-size="17" fill="#535c6b">Illustrative usage counters · no model or provider call</text>

    <text x="48" y="98" font-size="18" font-weight="700">Before the response: 18,500 tokens</text>
    <rect x="48" y="110" width="544" height="32" rx="4" fill="#f7f5ef" stroke="#ddd7ca" stroke-width="2"/>
    <rect x="48" y="110" width="402.56" height="32" rx="4" fill="#1d4e89"/>

    <text x="592" y="98" font-size="16" font-weight="700" fill="#9b2c2c" text-anchor="end">20,000-token threshold</text>

    <text x="48" y="182" font-size="18" font-weight="700">After it: 18,500 + 3,000 = 21,500</text>
    <rect x="48" y="194" width="544" height="32" rx="4" fill="#f7f5ef" stroke="#ddd7ca" stroke-width="2"/>
    <rect x="48" y="194" width="402.56" height="32" rx="4" fill="#1d4e89"/>
    <rect x="450.56" y="194" width="65.28" height="32" fill="#84540c"/>

    <path d="M483.2 104 V232" stroke="#9b2c2c" stroke-width="2.5" stroke-dasharray="6 4"/>

    <!-- scale -->
    <path d="M48 240 H592" stroke="#3b4453" stroke-width="2"/>
    <g stroke="#3b4453" stroke-width="2"><path d="M48 236 V246"/><path d="M483.2 236 V246"/><path d="M592 236 V246"/></g>
    <g font-size="16" fill="#535c6b">
      <text x="48" y="264">0 tokens</text>
      <text x="483.2" y="264" text-anchor="middle">20,000</text>
      <text x="592" y="264" text-anchor="end">25,000</text>
    </g>

    <rect x="48" y="282" width="16" height="16" fill="#1d4e89"/><text x="72" y="296" font-size="16">Earlier reported usage</text>
    <rect x="330" y="282" width="16" height="16" fill="#84540c"/><text x="354" y="296" font-size="16">This response's usage</text>

    <!-- time strip -->
    <text x="24" y="336" font-size="18" font-weight="700">When does the check run? In time order:</text>
    <g fill="#f3f6fa" stroke="#1d4e89" stroke-width="2">
      <rect x="24" y="350" width="136" height="84" rx="6"/>
      <rect x="176" y="350" width="136" height="84" rx="6"/>
      <rect x="328" y="350" width="136" height="84" rx="6"/>
    </g>
    <rect x="480" y="350" width="136" height="84" rx="6" fill="#fbf3f2" stroke="#9b2c2c" stroke-width="2"/>
    <g font-size="16" text-anchor="middle">
      <text x="92" y="374" font-weight="700">1. Request sent</text>
      <text x="92" y="396">check passes:</text>
      <text x="92" y="418">18,500 &lt; 20,000</text>
      <text x="244" y="374" font-weight="700">2. Provider</text>
      <text x="244" y="396">processes all</text>
      <text x="244" y="418">of it</text>
      <text x="396" y="374" font-weight="700">3. Response</text>
      <text x="396" y="396">reports usage:</text>
      <text x="396" y="418">+3,000</text>
      <text x="548" y="374" font-weight="700" fill="#9b2c2c">4. check_tokens</text>
      <text x="548" y="396">raises: the run</text>
      <text x="548" y="418">stops</text>
    </g>
    <path d="M24 450 H608" stroke="#3b4453" stroke-width="2" marker-end="url(#ah)"/>
    <text x="320" y="472" font-size="16" fill="#535c6b" text-anchor="middle">time passes</text>

    <rect x="24" y="490" width="592" height="96" rx="6" fill="#fbf3f2" stroke="#9b2c2c" stroke-width="2"/>
    <g text-anchor="middle">
      <text x="320" y="518" font-size="20" font-weight="700" fill="#9b2c2c">The check raises after the response.</text>
      <text x="320" y="546" font-size="18">It does not undo tokens already processed.</text>
      <text x="320" y="572" font-size="16" fill="#535c6b">Combine limits with provider controls and measured usage.</text>
    </g>
  </g>
</svg>
