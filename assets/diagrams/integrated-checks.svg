<svg xmlns="http://www.w3.org/2000/svg" width="760" height="610" viewBox="0 0 760 610" role="img" aria-labelledby="title description">
<title id="title">Test the boundaries of one running product</title>
<desc id="description">Three evidence views. A browser action reaches Streamlit, the backend and the AI service, and only the backend commits a validated result. With AI stopped, its request returns 503 without a partial row while ordinary CRUD still works. Removing and recreating containers preserves rows in the named database volume. Automated HTTP checks and manual browser checks are separate; TestModel does not measure model quality.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#344563"/></marker></defs>
<rect width="760" height="610" fill="#fff"/>
<g font-family="Arial, Helvetica, sans-serif" fill="#17243e">
<text x="24" y="34" font-size="23" font-weight="700">One product. Three kinds of evidence.</text>
<text x="24" y="61" font-size="16">Follow the request, interrupt a dependency, then recreate the containers.</text>
<g stroke="#d6d0c5" fill="#f7f5ef"><rect x="24" y="84" width="712" height="198" rx="5"/><rect x="24" y="302" width="712" height="121" rx="5"/><rect x="24" y="443" width="712" height="124" rx="5"/></g>
<text x="40" y="111" font-size="18" font-weight="700">1. A request is not yet a saved record</text>
<g fill="#fff" stroke="#344563" stroke-width="1.5"><rect x="40" y="133" width="127" height="55" rx="4"/><rect x="205" y="133" width="127" height="55" rx="4"/><rect x="370" y="133" width="145" height="55" rx="4"/><rect x="561" y="133" width="155" height="55" rx="4"/><rect x="370" y="221" width="145" height="42" rx="4"/></g>
<g text-anchor="middle" font-size="17"><text x="103" y="165">Browser</text><text x="268" y="165">Streamlit</text><text x="442" y="157">Backend</text><text x="442" y="178" font-size="14">validate candidate</text><text x="638" y="157">AI service</text><text x="638" y="178" font-size="14">TestModel here</text><text x="442" y="247">Database volume</text></g>
<g fill="none" stroke="#344563" stroke-width="2" marker-end="url(#arrow)"><path d="M167 160H200"/><path d="M332 160H365"/><path d="M515 153H556"/><path d="M561 177H520"/><path d="M442 188V216"/></g>
<text x="40" y="218" font-size="15">Browser: manual walkthrough</text><text x="40" y="244" font-size="15">HTTP: automated stack check</text><text x="528" y="246" font-size="15">commit only after validation</text>
<text x="40" y="330" font-size="18" font-weight="700">2. Stop AI after startup; observe two paths</text>
<text x="40" y="360" font-size="16" fill="#8c3034">Paste with AI → bounded 503 → no partial AI record</text>
<text x="40" y="391" font-size="16" fill="#24614d">Ordinary add / read / edit / delete → backend → database still works</text>
<text x="40" y="470" font-size="18" font-weight="700">3. Recreate containers; read the same saved rows</text>
<g fill="none" stroke="#344563" stroke-width="2" marker-end="url(#arrow)"><path d="M231 507H286"/><path d="M470 507H524"/></g>
<text x="40" y="511" font-size="17">compose down</text><text x="301" y="511" font-size="17">volume survives</text><text x="539" y="511" font-size="17">compose up</text>
<text x="40" y="544" font-size="15">Verify the same IDs and values. “down --volumes” deliberately deletes this data.</text>
<text x="24" y="594" font-size="15">These checks establish wiring and recovery. Measure real-model quality separately.</text>
</g></svg>
