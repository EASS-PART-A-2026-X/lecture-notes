<svg xmlns="http://www.w3.org/2000/svg" width="760" height="570" viewBox="0 0 760 570" role="img" aria-labelledby="title description">
<title id="title">The same trials answer three different questions</title>
<desc id="description">Synthetic matrix: task A passes all three trials, B passes trials one and three, C passes only trial two, D fails all three. Six of twelve trials pass, three of four tasks pass at least once, and one of four tasks passes every time. Those summaries are 50 percent, 75 percent and 25 percent. Task D's forbidden-action failure is not excused by an average.</desc>
<rect width="760" height="570" fill="white"/>
<g font-family="Arial, Helvetica, sans-serif" fill="#17243e">
<text x="24" y="36" font-size="23" font-weight="700">One success is not consistent success</text>
<text x="24" y="65" font-size="16">Synthetic teaching data. No model or product was measured.</text>
<rect x="24" y="90" width="712" height="302" rx="5" fill="#f7f5ef" stroke="#d6d0c5"/>
<g font-size="17" font-weight="700"><text x="42" y="123">Fixed task</text><text x="340" y="123">Trial 1</text><text x="475" y="123">Trial 2</text><text x="610" y="123">Trial 3</text></g>
<g font-size="17"><text x="42" y="175">A · ordinary recipe</text><text x="42" y="235">B · hours to minutes</text><text x="42" y="295">C · allowed tags</text><text x="42" y="355">D · hostile instruction denied</text></g>
<g fill="#24614d"><circle cx="365" cy="169" r="18"/><circle cx="500" cy="169" r="18"/><circle cx="635" cy="169" r="18"/><circle cx="365" cy="229" r="18"/><circle cx="635" cy="229" r="18"/><circle cx="500" cy="289" r="18"/></g>
<g fill="#8c3034"><circle cx="500" cy="229" r="18"/><circle cx="365" cy="289" r="18"/><circle cx="635" cy="289" r="18"/><circle cx="365" cy="349" r="18"/><circle cx="500" cy="349" r="18"/><circle cx="635" cy="349" r="18"/></g>
<g fill="white" text-anchor="middle" font-size="18" font-weight="700"><text x="365" y="175">P</text><text x="500" y="175">P</text><text x="635" y="175">P</text><text x="365" y="235">P</text><text x="500" y="235">F</text><text x="635" y="235">P</text><text x="365" y="295">F</text><text x="500" y="295">P</text><text x="635" y="295">F</text><text x="365" y="355">F</text><text x="500" y="355">F</text><text x="635" y="355">F</text></g>
<g fill="white" stroke="#344563"><rect x="24" y="412" width="224" height="94" rx="4"/><rect x="268" y="412" width="224" height="94" rx="4"/><rect x="512" y="412" width="224" height="94" rx="4"/></g>
<g text-anchor="middle"><text x="136" y="441" font-size="16">Trials that passed</text><text x="380" y="441" font-size="16">Tasks with any pass</text><text x="624" y="441" font-size="16">Tasks with every pass</text><text x="136" y="480" font-size="25" font-weight="700">6 / 12 = 50%</text><text x="380" y="480" font-size="25" font-weight="700">3 / 4 = 75%</text><text x="624" y="480" font-size="25" font-weight="700">1 / 4 = 25%</text></g>
<text x="24" y="542" font-size="16">P = pass, F = fail. A critical forbidden-action failure still blocks release.</text>
</g></svg>
