<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 430" role="img" aria-labelledby="t d" width="640" height="430">
  <title id="t">Smaller numbers, a separate quality check</title>
  <desc id="d">For one billion weights, ideal raw weight storage is 2 GB at 16 bits, 1 GB at 8 bits and 0.5 GB at 4 bits. Metadata, cache and workspace add memory. Quality must be measured again.</desc>
  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M1 1 L9 5 L1 9 Z" fill="#3b4453" />
    </marker>
  </defs>
  <rect width="640" height="430" fill="#ffffff" />
  <g font-family="Helvetica, Arial, 'Liberation Sans', sans-serif">
    <text x="24" y="36" font-size="23" fill="#0f1e3a" text-anchor="start">Smaller numbers, a separate quality check</text>
    <text x="24" y="80" font-size="18" fill="#0f1e3a" text-anchor="start">One billion weights; raw decimal GB only</text>
    <text x="24" y="125" font-size="18" fill="#0f1e3a" text-anchor="start">16 bits</text>
    <rect x="150" y="100" width="320" height="38" fill="#eff6f6" stroke="#22616b" stroke-width="2" />
    <text x="480" y="125" font-size="18" fill="#0f1e3a" text-anchor="start">2 GB</text>
    <text x="24" y="197" font-size="18" fill="#0f1e3a" text-anchor="start">8 bits</text>
    <rect x="150" y="172" width="160" height="38" fill="#eff6f6" stroke="#22616b" stroke-width="2" />
    <text x="320" y="197" font-size="18" fill="#0f1e3a" text-anchor="start">1 GB</text>
    <text x="24" y="269" font-size="18" fill="#0f1e3a" text-anchor="start">4 bits</text>
    <rect x="150" y="244" width="80" height="38" fill="#eff6f6" stroke="#22616b" stroke-width="2" />
    <text x="240" y="269" font-size="18" fill="#0f1e3a" text-anchor="start">0.5 GB</text>
    <rect x="24" y="330" width="592" height="75" rx="6" fill="#fbf6ec" stroke="#3b4453" stroke-width="2" />
    <text x="36" y="358" font-size="18" fill="#0f1e3a" text-anchor="start">Also budget for scales, KV cache and working memory.</text>
    <text x="36" y="383" font-size="18" fill="#0f1e3a" text-anchor="start">Less storage does not prove equal quality or more speed.</text>
  </g>
</svg>
