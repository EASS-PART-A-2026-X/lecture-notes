<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" role="img" aria-labelledby="t d">
  <title id="t">Who gives up first, and who retries</title>
  <desc id="d">Three timelines from 0 to 100 seconds, with lanes for the backend and the ai-service. Refused: the ai-service is stopped; the backend fails three times within about 1.5 seconds and answers 503; nothing runs or is billed. Slow model: each attempt reaches the ai-service, whose 25-second cap fires and returns 504; the backend retries after 0.5 and 1 second and answers 503 at 76.5 seconds. Silent server: the ai-service accepts the connection but sends nothing; the backend's 30-second read timeout fires three times and it answers 503 at 91.5 seconds, while earlier attempts may still be running. The frontend waits up to 100 seconds and never retries.</desc>
  <defs>
    <marker id="ah" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0 0 L11 6 L0 12 Z" fill="#3b4453"/>
    </marker>
  </defs>
  <rect width="960" height="520" fill="#ffffff"/>
  <g font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" fill="#0f1e3a">
    <text x="24" y="34" font-size="22" font-weight="700">Who gives up first, and who retries?</text>
    <text x="24" y="60" font-size="17" fill="#535c6b">Seconds after the user presses "Extract with AI". Only the backend retries; the frontend never retries a write.</text>

    <!-- time axis -->
    <g font-size="16" fill="#535c6b" text-anchor="middle">
      <text x="210" y="84">0 s</text>
      <text x="382.5" y="84">25 s</text>
      <text x="555" y="84">50 s</text>
      <text x="727.5" y="84">75 s</text>
      <text x="900" y="84">100 s</text>
    </g>
    <path d="M210 92 H900" stroke="#3b4453" stroke-width="2"/>
    <g stroke="#3b4453" stroke-width="2">
      <path d="M210 88 V96"/><path d="M382.5 88 V96"/><path d="M555 88 V96"/><path d="M727.5 88 V96"/><path d="M900 88 V96"/>
    </g>
    <g stroke="#ddd7ca" stroke-width="1.5" stroke-dasharray="4 5">
      <path d="M382.5 240 V470"/><path d="M555 240 V470"/><path d="M727.5 240 V470"/>
    </g>
    <!-- frontend limit -->
    <path d="M900 98 V470" stroke="#9b2c2c" stroke-width="2.5" stroke-dasharray="8 5"/>
    <text x="892" y="114" font-size="16" font-weight="700" fill="#9b2c2c" text-anchor="end">frontend gives up at 100 s</text>

    <!-- panel 1: refused -->
    <text x="24" y="122" font-size="18" font-weight="700">1  Refused: nothing reaches the ai-service, so the backend fails fast</text>
    <text x="24" y="149" font-size="17">Backend</text>
    <rect x="210" y="132" width="12" height="26" rx="3" fill="#fbf3f2" stroke="#9b2c2c" stroke-width="2"/>
    <text x="234" y="151" font-size="17">3 × ConnectError in about 1.5 s (plus name lookups), then 503</text>
    <text x="24" y="185" font-size="17">ai-service</text>
    <text x="210" y="185" font-size="17" fill="#535c6b">stopped: nothing runs, nothing is billed</text>

    <!-- panel 2: slow model -->
    <text x="24" y="232" font-size="18" font-weight="700">2  Slow model: the ai-service gives up first (25 s cap, 504); the backend retries</text>
    <g font-size="16" text-anchor="end" fill="#1d4e89">
      <text x="378" y="258">retry after 0.5 s</text>
      <text x="556" y="258">retry after 1 s</text>
    </g>
    <g stroke="#3b4453" stroke-width="2" marker-end="url(#ah)">
      <path d="M384 244 V265"/><path d="M562 244 V265"/>
    </g>
    <text x="24" y="287" font-size="17">Backend</text>
    <g fill="#f3f6fa" stroke="#1d4e89" stroke-width="2">
      <rect x="210" y="268" width="172.5" height="28" rx="6"/>
      <rect x="386" y="268" width="172.5" height="28" rx="6"/>
      <rect x="565.4" y="268" width="172.5" height="28" rx="6"/>
    </g>
    <g font-size="16" text-anchor="middle" fill="#1d4e89">
      <text x="296" y="288">attempt 1</text>
      <text x="472" y="288">attempt 2</text>
      <text x="651.5" y="288">attempt 3</text>
    </g>
    <text x="748" y="288" font-size="16" font-weight="700" fill="#9b2c2c">503 at 76.5 s</text>
    <text x="24" y="323" font-size="17">ai-service</text>
    <g fill="#fbf6ec" stroke="#84540c" stroke-width="2">
      <rect x="210" y="304" width="172.5" height="28" rx="6"/>
      <rect x="386" y="304" width="172.5" height="28" rx="6"/>
      <rect x="565.4" y="304" width="172.5" height="28" rx="6"/>
    </g>
    <g fill="#9b2c2c">
      <rect x="376.5" y="304" width="6" height="28"/>
      <rect x="552.5" y="304" width="6" height="28"/>
      <rect x="731.9" y="304" width="6" height="28"/>
    </g>
    <g font-size="16" text-anchor="middle" fill="#84540c">
      <text x="293" y="324">model runs → 504</text>
      <text x="469" y="324">model runs → 504</text>
      <text x="648.5" y="324">model runs → 504</text>
    </g>

    <!-- panel 3: silent server -->
    <text x="24" y="370" font-size="18" font-weight="700">3  Silent server: the backend gives up first (30 s read timeout) and retries</text>
    <g font-size="16" text-anchor="end" fill="#1d4e89">
      <text x="413" y="396">retry after 0.5 s</text>
      <text x="625" y="396">retry after 1 s</text>
    </g>
    <text x="835" y="396" font-size="16" font-weight="700" fill="#9b2c2c" text-anchor="end">503 at 91.5 s</text>
    <g stroke="#3b4453" stroke-width="2" marker-end="url(#ah)">
      <path d="M419 382 V403"/><path d="M631 382 V403"/><path d="M841 382 V403"/>
    </g>
    <text x="24" y="425" font-size="17">Backend</text>
    <g fill="#f3f6fa" stroke="#1d4e89" stroke-width="2">
      <rect x="210" y="406" width="207" height="28" rx="6"/>
      <rect x="420.5" y="406" width="207" height="28" rx="6"/>
      <rect x="634.4" y="406" width="207" height="28" rx="6"/>
    </g>
    <g font-size="16" text-anchor="middle" fill="#1d4e89">
      <text x="313.5" y="426">attempt 1 times out</text>
      <text x="524" y="426">attempt 2 times out</text>
      <text x="738" y="426">attempt 3 times out</text>
    </g>
    <text x="24" y="461" font-size="17">ai-service</text>
    <rect x="210" y="442" width="690" height="28" rx="6" fill="#f7f5ef" stroke="#3b4453" stroke-width="2" stroke-dasharray="7 5"/>
    <text x="555" y="462" font-size="16" text-anchor="middle" fill="#0f1e3a">hung: accepts each attempt, sends no bytes; earlier attempts may still be running</text>

    <!-- legend -->
    <g font-size="16" fill="#0f1e3a">
      <rect x="24" y="490" width="26" height="18" rx="4" fill="#f3f6fa" stroke="#1d4e89" stroke-width="2"/>
      <text x="58" y="504">backend attempt</text>
      <rect x="216" y="490" width="26" height="18" rx="4" fill="#fbf6ec" stroke="#84540c" stroke-width="2"/>
      <text x="250" y="504">model running</text>
      <rect x="388" y="490" width="8" height="18" fill="#9b2c2c"/>
      <text x="404" y="504">504 sent</text>
      <rect x="500" y="490" width="26" height="18" rx="4" fill="#f7f5ef" stroke="#3b4453" stroke-width="2" stroke-dasharray="5 4"/>
      <text x="534" y="504">no reply (dashed)</text>
      <path d="M700 499 H740" stroke="#9b2c2c" stroke-width="2.5" stroke-dasharray="8 5"/>
      <text x="748" y="504">frontend limit (100 s)</text>
    </g>
  </g>
</svg>
