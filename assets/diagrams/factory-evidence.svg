<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 660" role="img" aria-labelledby="t d">
  <title id="t">Evidence belongs to the source revision that was checked</title>
  <desc id="d">Candidate A, committed source in a clean checkout, is run through check A, which observes a pass, and the record is evidence A, which describes A only. Editing the source creates candidate B. B has not been verified: A's result is still about A, not B. Commit B and take a clean checkout, then run check B. If it passes, record evidence B, which describes B only. If it fails, record the failure and use the remaining repair budget; never copy A's passing status. A and B are illustrative revision labels. Before review, a reliable record identifies the checked source, the procedure, the environment and the results.</desc>
  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L9 5 L1 9 Z" fill="#3b4453"/></marker>
    <marker id="g" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L9 5 L1 9 Z" fill="#2a6a47"/></marker>
    <marker id="o" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L9 5 L1 9 Z" fill="#84540c"/></marker>
  </defs>
  <rect width="640" height="660" fill="#ffffff"/>
  <g font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" fill="#0f1e3a">
    <text x="320" y="32" text-anchor="middle" font-size="22" font-weight="700">A passing result has a scope</text>
    <text x="320" y="56" text-anchor="middle" font-size="16" fill="#535c6b">A and B are illustrative source revisions, not real commit ids</text>

    <!-- Row A -->
    <rect x="16" y="80" width="190" height="96" rx="6" fill="#f3f6fa" stroke="#1d4e89" stroke-width="2"/>
    <rect x="256" y="80" width="150" height="96" rx="6" fill="#f1f7f3" stroke="#2a6a47" stroke-width="2"/>
    <rect x="462" y="80" width="162" height="96" rx="6" fill="#f7f5ef" stroke="#3b4453" stroke-width="2"/>
    <g text-anchor="middle">
      <text x="111" y="109" font-size="19" font-weight="700">Candidate A</text>
      <text x="111" y="134" font-size="16">committed source,</text>
      <text x="111" y="156" font-size="16">clean checkout</text>
      <text x="331" y="120" font-size="19" font-weight="700">Check A</text>
      <text x="331" y="146" font-size="16">observed pass</text>
      <text x="543" y="120" font-size="19" font-weight="700">Evidence A</text>
      <text x="543" y="146" font-size="16">describes A only</text>
    </g>

    <!-- Row B, unverified -->
    <rect x="16" y="232" width="190" height="88" rx="6" fill="#fbf6ec" stroke="#84540c" stroke-width="2"/>
    <text x="111" y="261" text-anchor="middle" font-size="19" font-weight="700">Candidate B</text>
    <text x="111" y="285" text-anchor="middle" font-size="16">edited, not yet</text>
    <text x="111" y="306" text-anchor="middle" font-size="16">committed or checked</text>
    <rect x="256" y="232" width="368" height="88" rx="6" fill="#fbf6ec" stroke="#84540c" stroke-width="2"/>
    <text x="276" y="268" font-size="19" font-weight="700" fill="#84540c">B has not been verified.</text>
    <text x="276" y="296" font-size="17">A's result is still about A, not B.</text>

    <!-- Row B, checked -->
    <rect x="16" y="380" width="190" height="96" rx="6" fill="#f3f6fa" stroke="#1d4e89" stroke-width="2"/>
    <rect x="256" y="380" width="150" height="96" rx="6" fill="#f3f6fa" stroke="#1d4e89" stroke-width="2"/>
    <rect x="462" y="380" width="162" height="96" rx="6" fill="#f1f7f3" stroke="#2a6a47" stroke-width="2"/>
    <g text-anchor="middle">
      <text x="111" y="409" font-size="19" font-weight="700">Candidate B</text>
      <text x="111" y="434" font-size="16">committed source,</text>
      <text x="111" y="456" font-size="16">clean checkout</text>
      <text x="331" y="420" font-size="19" font-weight="700">Check B</text>
      <text x="331" y="446" font-size="16">observe the result</text>
      <text x="543" y="420" font-size="19" font-weight="700">Evidence B</text>
      <text x="543" y="446" font-size="16">describes B only</text>
    </g>

    <!-- Fail branch -->
    <rect x="256" y="532" width="368" height="64" rx="6" fill="#fbf6ec" stroke="#84540c" stroke-width="2"/>
    <text x="272" y="558" font-size="17" font-weight="700" fill="#84540c">Record the failure; use what is left</text>
    <text x="272" y="582" font-size="16">of the repair budget. Never copy A's pass.</text>

    <g fill="none" stroke="#3b4453" stroke-width="2.5" marker-end="url(#a)">
      <path d="M206 128 H252"/>
      <path d="M406 128 H458"/>
      <path d="M206 428 H252"/>
      <path d="M406 428 H458"/>
    </g>
    <g font-size="16" text-anchor="middle">
      <text x="229" y="119">run</text>
      <text x="432" y="119">record</text>
      <text x="229" y="419">run</text>
      <text x="432" y="419" font-weight="700" fill="#2a6a47">pass</text>
    </g>
    <path d="M111 176 V228" fill="none" stroke="#84540c" stroke-width="2.5" marker-end="url(#o)"/>
    <text x="124" y="208" font-size="16" font-weight="700" fill="#84540c">edit the source</text>
    <path d="M111 320 V376" fill="none" stroke="#2a6a47" stroke-width="2.5" marker-end="url(#g)"/>
    <text x="124" y="354" font-size="16" font-weight="700" fill="#2a6a47">commit, then check out cleanly and rerun</text>
    <path d="M331 476 V528" fill="none" stroke="#84540c" stroke-width="2.5" marker-end="url(#o)"/>
    <text x="343" y="508" font-size="16" font-weight="700" fill="#84540c">fail</text>

    <text x="320" y="634" text-anchor="middle" font-size="17" fill="#535c6b">Record source + procedure + environment + results before review.</text>
  </g>
</svg>
