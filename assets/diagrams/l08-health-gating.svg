<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 620" role="img" aria-labelledby="t d">
<title id="t">Startup ordering with service_healthy, and what happens later</title>
<desc id="d">Two timelines for the ai-service, backend and frontend containers. A, normal start: ai-service is starting, then healthy; only then is the backend started, and when it is healthy the frontend is started; up --wait returns. Later the ai-service crashes and exits; nothing restarts it, the backend stays healthy, a paste gets 503 and CRUD keeps working. B, the AI healthcheck never passes: ai-service goes from starting to unhealthy, the backend and frontend stay Created and never start, and up --wait fails with dependency failed to start: container recipe-box-ai-service-1 is unhealthy, so CRUD is down too.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#3b4453" stroke-width="2"/></marker></defs>
<rect width="640" height="620" fill="#ffffff"/>
<g font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" fill="#0f1e3a">
<text x="20" y="34" font-size="21" font-weight="700">What service_healthy orders, and what it does not</text>
<!-- panel A -->
<rect x="10" y="50" width="620" height="270" rx="6" fill="none" stroke="#ddd7ca" stroke-width="2"/>
<text x="20" y="76" font-size="18" font-weight="700">A. Normal start; later the AI service crashes</text>
<text x="620" y="76" font-size="16" text-anchor="end" fill="#535c6b">time →</text>
<g font-size="16"><text x="20" y="114">ai-service</text><text x="20" y="172">backend</text><text x="20" y="230">frontend</text></g>
<!-- ai-service A -->
<rect x="130" y="94" width="100" height="28" rx="4" fill="#fbf6ec" stroke="#84540c" stroke-width="2"/>
<rect x="230" y="94" width="230" height="28" rx="4" fill="#f1f7f3" stroke="#2a6a47" stroke-width="2"/>
<rect x="460" y="94" width="160" height="28" rx="4" fill="#fbf3f2" stroke="#9b2c2c" stroke-width="2"/>
<rect x="457" y="88" width="6" height="40" fill="#9b2c2c"/>
<!-- backend A -->
<rect x="130" y="152" width="100" height="28" rx="4" fill="#f7f5ef" stroke="#3b4453" stroke-width="2" stroke-dasharray="6 5"/>
<rect x="230" y="152" width="80" height="28" rx="4" fill="#fbf6ec" stroke="#84540c" stroke-width="2"/>
<rect x="310" y="152" width="310" height="28" rx="4" fill="#f1f7f3" stroke="#2a6a47" stroke-width="2"/>
<!-- frontend A -->
<rect x="130" y="210" width="180" height="28" rx="4" fill="#f7f5ef" stroke="#3b4453" stroke-width="2" stroke-dasharray="6 5"/>
<rect x="310" y="210" width="70" height="28" rx="4" fill="#fbf6ec" stroke="#84540c" stroke-width="2"/>
<rect x="380" y="210" width="240" height="28" rx="4" fill="#f1f7f3" stroke="#2a6a47" stroke-width="2"/>
<g font-size="16">
<text x="140" y="114">starting</text><text x="240" y="114">healthy</text><text x="472" y="114" font-weight="700" fill="#9b2c2c">crashed: exited</text>
<text x="140" y="172">Created</text><text x="238" y="172">starting</text><text x="320" y="172">healthy, and stays healthy</text>
<text x="140" y="230">Created (waits)</text><text x="316" y="230">starting</text><text x="390" y="230">healthy</text>
</g>
<g stroke="#3b4453" stroke-width="2" fill="none" marker-end="url(#arrow)"><path d="M230 124 V148"/><path d="M310 182 V206"/></g>
<g font-size="16"><text x="242" y="143">healthy → starts backend</text><text x="322" y="201">healthy → starts frontend</text></g>
<text x="470" y="142" font-size="16">nothing restarts it</text>
<text x="390" y="262" font-size="16" fill="#2a6a47" font-weight="700">up --wait returns</text>
<text x="20" y="300" font-size="16">Later: a paste gets 503, CRUD keeps working (Lecture 7's path).</text>
<!-- panel B -->
<rect x="10" y="336" width="620" height="230" rx="6" fill="none" stroke="#ddd7ca" stroke-width="2"/>
<text x="20" y="362" font-size="18" font-weight="700">B. The AI healthcheck never passes</text>
<text x="620" y="362" font-size="16" text-anchor="end" fill="#535c6b">time →</text>
<g font-size="16"><text x="20" y="400">ai-service</text><text x="20" y="448">backend</text><text x="20" y="496">frontend</text></g>
<rect x="130" y="380" width="100" height="28" rx="4" fill="#fbf6ec" stroke="#84540c" stroke-width="2"/>
<rect x="230" y="380" width="390" height="28" rx="4" fill="#fbf3f2" stroke="#9b2c2c" stroke-width="2"/>
<rect x="130" y="428" width="490" height="28" rx="4" fill="#f7f5ef" stroke="#3b4453" stroke-width="2" stroke-dasharray="6 5"/>
<rect x="130" y="476" width="490" height="28" rx="4" fill="#f7f5ef" stroke="#3b4453" stroke-width="2" stroke-dasharray="6 5"/>
<g font-size="16">
<text x="140" y="400">starting</text><text x="240" y="400" font-weight="700" fill="#9b2c2c">unhealthy: retries used up</text>
<text x="140" y="448">Created: never started (CRUD is down too)</text>
<text x="140" y="496">Created: never started</text>
<text x="20" y="532"><tspan font-weight="700" fill="#9b2c2c">up --wait fails:</tspan> “dependency failed to start:</text>
<text x="20" y="554">container recipe-box-ai-service-1 is unhealthy”</text>
</g>
<!-- legend -->
<g font-size="16">
<rect x="20" y="580" width="26" height="16" rx="3" fill="#f7f5ef" stroke="#3b4453" stroke-width="2" stroke-dasharray="6 5"/><text x="54" y="594">Created, not started</text>
<rect x="230" y="580" width="26" height="16" rx="3" fill="#fbf6ec" stroke="#84540c" stroke-width="2"/><text x="264" y="594">starting</text>
<rect x="350" y="580" width="26" height="16" rx="3" fill="#f1f7f3" stroke="#2a6a47" stroke-width="2"/><text x="384" y="594">healthy</text>
<rect x="470" y="580" width="26" height="16" rx="3" fill="#fbf3f2" stroke="#9b2c2c" stroke-width="2"/><text x="504" y="594">failed</text>
<text x="20" y="614" fill="#535c6b">Each bar is also labelled with its state.</text>
</g>
</g>
</svg>
