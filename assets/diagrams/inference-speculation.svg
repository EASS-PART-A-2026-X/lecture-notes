<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 440" role="img" aria-labelledby="t d" width="640" height="440">
  <title id="t">Draft, verify, keep only a valid continuation</title>
  <desc id="d">Greedy toy example: a draft proposes add salt now. The target agrees with add, disagrees at salt and chooses water. The following draft token now is discarded because its prefix changed.</desc>
  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M1 1 L9 5 L1 9 Z" fill="#3b4453" />
    </marker>
  </defs>
  <rect width="640" height="440" fill="#ffffff" />
  <g font-family="Helvetica, Arial, 'Liberation Sans', sans-serif">
    <text x="24" y="36" font-size="23" fill="#0f1e3a" text-anchor="start">Draft, verify, keep only a valid continuation</text>
    <text x="24" y="85" font-size="16" fill="#0f1e3a" text-anchor="start">Greedy toy tokens; not a tokenizer benchmark.</text>
    <text x="24" y="140" font-size="18" fill="#0f1e3a" text-anchor="start">Draft</text>
    <rect x="160" y="110" width="130" height="50" rx="6" fill="#f3f6fa" stroke="#3b4453" stroke-width="2" />
    <text x="172" y="138" font-size="18" fill="#0f1e3a" text-anchor="start">add</text>
    <rect x="310" y="110" width="130" height="50" rx="6" fill="#f3f6fa" stroke="#3b4453" stroke-width="2" />
    <text x="322" y="138" font-size="18" fill="#0f1e3a" text-anchor="start">salt</text>
    <rect x="460" y="110" width="145" height="50" rx="6" fill="#f3f6fa" stroke="#3b4453" stroke-width="2" />
    <text x="472" y="138" font-size="18" fill="#0f1e3a" text-anchor="start">now</text>
    <text x="24" y="220" font-size="18" fill="#0f1e3a" text-anchor="start">Target check</text>
    <rect x="160" y="190" width="130" height="60" rx="6" fill="#f1f7f3" stroke="#3b4453" stroke-width="2" />
    <text x="172" y="218" font-size="18" fill="#0f1e3a" text-anchor="start">accept</text>
    <rect x="310" y="190" width="130" height="60" rx="6" fill="#fbf3f2" stroke="#3b4453" stroke-width="2" />
    <text x="322" y="218" font-size="18" fill="#0f1e3a" text-anchor="start">reject</text>
    <rect x="460" y="190" width="145" height="60" rx="6" fill="#fbf3f2" stroke="#3b4453" stroke-width="2" />
    <text x="472" y="218" font-size="18" fill="#0f1e3a" text-anchor="start">discard</text>
    <text x="24" y="310" font-size="18" fill="#0f1e3a" text-anchor="start">Keep</text>
    <rect x="160" y="280" width="130" height="50" rx="6" fill="#f1f7f3" stroke="#3b4453" stroke-width="2" />
    <text x="172" y="308" font-size="18" fill="#0f1e3a" text-anchor="start">add</text>
    <rect x="310" y="280" width="130" height="50" rx="6" fill="#f1f7f3" stroke="#3b4453" stroke-width="2" />
    <text x="322" y="308" font-size="18" fill="#0f1e3a" text-anchor="start">water</text>
    <text x="24" y="380" font-size="16" fill="#0f1e3a" text-anchor="start">Sampling uses a probability correction, not word matching.</text>
    <text x="24" y="408" font-size="16" fill="#0f1e3a" text-anchor="start">Draft cost + verification must beat ordinary generation.</text>
  </g>
</svg>
