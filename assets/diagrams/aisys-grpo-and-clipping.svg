<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" role="img" aria-labelledby="t d">
  <title id="t">How GRPO scores a group and clipping keeps RL updates safe</title>
  <desc id="d">Left panel shows GRPO scoring four parallel tries with rewards 1, 0, 1, 0 around group mean 0.5, producing advantages plus 1.0 and minus 1.0, and warning that identical outcomes yield zero learning. Right panel charts clipped policy ratio optimization capping rho_t at 1.2 so one lucky rollout cannot overshoot weights.</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L8 4.5 L1 8 Z" fill="#3b4453"/></marker>
  </defs>
  <rect width="960" height="460" fill="#ffffff"/>
  <g font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" fill="#0f1e3a">
    <text x="480" y="32" text-anchor="middle" font-size="22" font-weight="700">How GRPO scores a group and clipping keeps RL updates safe</text>
    <text x="480" y="56" text-anchor="middle" font-size="15" fill="#535c6b">Grade parallel fixes against their group average, then cap how far one update step moves weights.</text>

    <!-- Left Panel: GRPO Group Scoring -->
    <rect x="24" y="76" width="444" height="360" rx="8" fill="#f1f7f3" stroke="#2a6a47" stroke-width="2"/>
    <text x="246" y="104" text-anchor="middle" font-size="17" font-weight="700" fill="#2a6a47">1. GRPO: compare tries inside one group</text>
    <rect x="108" y="116" width="276" height="26" rx="13" fill="#ffffff" stroke="#2a6a47" stroke-width="1.2"/>
    <text x="246" y="134" text-anchor="middle" font-size="13" font-weight="700">1 prompt &#x2192; 4 parallel pytest attempts</text>

    <!-- Chart Box -->
    <rect x="48" y="154" width="396" height="212" rx="6" fill="#ffffff" stroke="#ddd7ca" stroke-width="1"/>
    <!-- Zero baseline y=254 (+1.0 at y=188, -1.0 at y=320), bars shifted left so right side holds mean label cleanly -->
    <line x1="64" y1="254" x2="432" y2="254" stroke="#3b4453" stroke-width="1.5" stroke-dasharray="5,4"/>
    <text x="386" y="242" text-anchor="middle" font-size="12" font-weight="700" fill="#535c6b">Group mean</text>
    <text x="386" y="270" text-anchor="middle" font-size="12" font-weight="700" fill="#535c6b">r&#x304; = 0.5 (A = 0)</text>

    <!-- Try 1 (+1.0) -->
    <rect x="68" y="190" width="46" height="64" rx="4" fill="#2a6a47"/>
    <text x="91" y="182" text-anchor="middle" font-size="13" font-weight="700" fill="#2a6a47">+1.0</text>
    <text x="91" y="348" text-anchor="middle" font-size="12" font-weight="700">Try 1 (1.0)</text>

    <!-- Try 2 (-1.0) -->
    <rect x="136" y="254" width="46" height="64" rx="4" fill="#9b2c2c"/>
    <text x="159" y="332" text-anchor="middle" font-size="13" font-weight="700" fill="#9b2c2c">-1.0</text>
    <text x="159" y="352" text-anchor="middle" font-size="12" font-weight="700">Try 2 (0.0)</text>

    <!-- Try 3 (+1.0) -->
    <rect x="204" y="190" width="46" height="64" rx="4" fill="#2a6a47"/>
    <text x="227" y="182" text-anchor="middle" font-size="13" font-weight="700" fill="#2a6a47">+1.0</text>
    <text x="227" y="348" text-anchor="middle" font-size="12" font-weight="700">Try 3 (1.0)</text>

    <!-- Try 4 (-1.0) -->
    <rect x="272" y="254" width="46" height="64" rx="4" fill="#9b2c2c"/>
    <text x="295" y="332" text-anchor="middle" font-size="13" font-weight="700" fill="#9b2c2c">-1.0</text>
    <text x="295" y="352" text-anchor="middle" font-size="12" font-weight="700">Try 4 (0.0)</text>

    <!-- Zero Variance Catch -->
    <rect x="48" y="378" width="396" height="44" rx="6" fill="#fbf6ec" stroke="#84540c" stroke-width="1.5"/>
    <text x="246" y="405" text-anchor="middle" font-size="13" font-weight="700" fill="#84540c">All [1,1,1,1] or all [0,0,0,0] &#x2192; spread &#x3C3;_r = 0 &#x2192; 0 learning</text>

    <!-- Right Panel: Clipped Policy Ratio -->
    <rect x="492" y="76" width="444" height="360" rx="8" fill="#f3f6fa" stroke="#1d4e89" stroke-width="2"/>
    <text x="714" y="104" text-anchor="middle" font-size="17" font-weight="700" fill="#1d4e89">2. Clipping: cap huge probability jumps</text>

    <!-- Plot Box -->
    <rect x="556" y="122" width="356" height="244" fill="#ffffff" stroke="#ddd7ca" stroke-width="1"/>
    <!-- Trust Region Band [0.8, 1.2] -->
    <rect x="656" y="122" width="80" height="244" fill="#f1f7f3"/>
    <text x="696" y="142" text-anchor="middle" font-size="12" font-weight="700" fill="#2a6a47">Safe band [0.8, 1.2]</text>

    <!-- Axes -->
    <line x1="556" y1="340" x2="912" y2="340" stroke="#3b4453" stroke-width="1.5"/>
    <line x1="556" y1="122" x2="556" y2="366" stroke="#3b4453" stroke-width="1.5"/>
    <!-- Y Ticks -->
    <text x="548" y="344" text-anchor="end" font-size="12" fill="#535c6b">0</text>
    <text x="548" y="244" text-anchor="end" font-size="12" fill="#535c6b">1.0</text>
    <text x="548" y="220" text-anchor="end" font-size="12" font-weight="700" fill="#1d4e89">1.2</text>
    <text x="548" y="164" text-anchor="end" font-size="12" font-weight="700" fill="#9b2c2c">1.8</text>
    <!-- X Ticks -->
    <text x="656" y="358" text-anchor="middle" font-size="12" fill="#535c6b">0.8</text>
    <text x="696" y="358" text-anchor="middle" font-size="12" font-weight="700">1.0</text>
    <text x="736" y="358" text-anchor="middle" font-size="12" fill="#535c6b">1.2</text>
    <text x="856" y="358" text-anchor="middle" font-size="12" font-weight="700" fill="#9b2c2c">1.8</text>

    <!-- Unclipped Line -->
    <line x1="576" y1="300" x2="896" y2="140" stroke="#9b2c2c" stroke-width="2.2" stroke-dasharray="6,4"/>
    <text x="892" y="138" text-anchor="end" font-size="12" font-weight="700" fill="#9b2c2c">Unclipped</text>

    <!-- Clipped Line -->
    <polyline points="576,300 736,220 896,220" fill="none" stroke="#1d4e89" stroke-width="3.2"/>
    <circle cx="856" cy="160" r="5" fill="#9b2c2c"/>
    <circle cx="856" cy="220" r="5.5" fill="#1d4e89"/>
    <path d="M856 168 V208" fill="none" stroke="#3b4453" stroke-width="1.8" marker-end="url(#arrow)"/>
    <text x="856" y="242" text-anchor="middle" font-size="12" font-weight="700" fill="#1d4e89">Capped at 1.2</text>

    <!-- Bottom Caption Pill -->
    <rect x="514" y="378" width="400" height="44" rx="6" fill="#ffffff" stroke="#1d4e89" stroke-width="1.5"/>
    <text x="714" y="405" text-anchor="middle" font-size="13" font-weight="700">For A = +1.0, &#x3C1;_t = 1.8 stops at 1.2 (ratio &#x3C1;_t = &#x3C0;_new / &#x3C0;_old)</text>
  </g>
</svg>
