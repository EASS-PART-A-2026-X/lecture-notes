<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 520" role="img" aria-labelledby="t d">
  <title id="t">One push, one commit, five check runs</title>
  <desc id="d">A push to main or a pull request starts one workflow run for one commit, shown as the illustrative SHA a1b2c3d. Pushing the tag v1.0.0-rc.1 starts no run, because on.push lists only the main branch. Inside the run, four jobs start in parallel on fresh runners: test for backend, test for ai-service, test for frontend, and audit. The compose job waits for all three test jobs and is skipped if one fails. Each job is one check run on the pull request. Solid boxes are required checks that must be green before you tag; the dashed audit box is advisory, because continue-on-error lets it fail without failing the run.</desc>
  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L9 5 L1 9 Z" fill="#3b4453"/></marker>
  </defs>
  <rect width="640" height="520" fill="#ffffff"/>
  <g font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" fill="#0f1e3a">
    <text x="320" y="32" text-anchor="middle" font-size="21" font-weight="700">One push, one commit, five check runs</text>

    <rect x="24" y="50" width="300" height="68" rx="6" fill="#f3f6fa" stroke="#1d4e89" stroke-width="2"/>
    <text x="174" y="79" text-anchor="middle" font-size="18" font-weight="700">push to main</text>
    <text x="174" y="104" text-anchor="middle" font-size="17">or a pull request</text>

    <rect x="344" y="50" width="272" height="68" rx="6" fill="#fbf3f2" stroke="#9b2c2c" stroke-width="2"/>
    <text x="480" y="79" text-anchor="middle" font-size="18" font-weight="700">push tag v1.0.0-rc.1</text>
    <text x="480" y="104" text-anchor="middle" font-size="17" fill="#9b2c2c">starts no run (on: main only)</text>

    <path d="M174 118 V144" fill="none" stroke="#3b4453" stroke-width="2.5" marker-end="url(#a)"/>
    <text x="184" y="138" font-size="16">starts</text>

    <rect x="24" y="148" width="592" height="60" rx="6" fill="#f7f5ef" stroke="#3b4453" stroke-width="2"/>
    <text x="320" y="172" text-anchor="middle" font-size="18" font-weight="700">one workflow run for commit a1b2c3d (example)</text>
    <text x="320" y="196" text-anchor="middle" font-size="16" fill="#535c6b">every job checks this same SHA; each job is one check run on the PR</text>

    <path d="M92 208 V240" fill="none" stroke="#3b4453" stroke-width="2.5" marker-end="url(#a)"/>
    <path d="M244 208 V240" fill="none" stroke="#3b4453" stroke-width="2.5" marker-end="url(#a)"/>
    <path d="M396 208 V240" fill="none" stroke="#3b4453" stroke-width="2.5" marker-end="url(#a)"/>
    <path d="M548 208 V240" fill="none" stroke="#3b4453" stroke-width="2.5" marker-end="url(#a)"/>
    <text x="320" y="231" text-anchor="middle" font-size="16">run in parallel</text>

    <rect x="24" y="244" width="136" height="70" rx="6" fill="#f3f6fa" stroke="#1d4e89" stroke-width="2"/>
    <text x="92" y="273" text-anchor="middle" font-size="18" font-weight="700">test</text>
    <text x="92" y="298" text-anchor="middle" font-size="16">(backend)</text>
    <rect x="176" y="244" width="136" height="70" rx="6" fill="#f3f6fa" stroke="#1d4e89" stroke-width="2"/>
    <text x="244" y="273" text-anchor="middle" font-size="18" font-weight="700">test</text>
    <text x="244" y="298" text-anchor="middle" font-size="16">(ai-service)</text>
    <rect x="328" y="244" width="136" height="70" rx="6" fill="#f3f6fa" stroke="#1d4e89" stroke-width="2"/>
    <text x="396" y="273" text-anchor="middle" font-size="18" font-weight="700">test</text>
    <text x="396" y="298" text-anchor="middle" font-size="16">(frontend)</text>
    <rect x="480" y="244" width="136" height="70" rx="6" fill="#fbf6ec" stroke="#84540c" stroke-width="2" stroke-dasharray="7 5"/>
    <text x="548" y="273" text-anchor="middle" font-size="18" font-weight="700">audit</text>
    <text x="548" y="298" text-anchor="middle" font-size="16">uv audit ×3</text>

    <path d="M92 314 L164 366" fill="none" stroke="#3b4453" stroke-width="2.5" marker-end="url(#a)"/>
    <path d="M244 314 V366" fill="none" stroke="#3b4453" stroke-width="2.5" marker-end="url(#a)"/>
    <path d="M396 314 L324 366" fill="none" stroke="#3b4453" stroke-width="2.5" marker-end="url(#a)"/>
    <text x="414" y="346" font-size="16">waits for all 3 (needs)</text>
    <text x="414" y="368" font-size="16" fill="#535c6b">skipped if one fails</text>

    <rect x="84" y="370" width="320" height="68" rx="6" fill="#f3f6fa" stroke="#1d4e89" stroke-width="2"/>
    <text x="244" y="398" text-anchor="middle" font-size="18" font-weight="700">compose</text>
    <text x="244" y="422" text-anchor="middle" font-size="16">build · up --wait · smoke curl · down -v</text>

    <rect x="24" y="462" width="34" height="20" rx="4" fill="#f3f6fa" stroke="#1d4e89" stroke-width="2"/>
    <text x="68" y="478" font-size="16">required check: must be green before you tag</text>
    <rect x="24" y="490" width="34" height="20" rx="4" fill="#fbf6ec" stroke="#84540c" stroke-width="2" stroke-dasharray="7 5"/>
    <text x="68" y="506" font-size="16">advisory check (continue-on-error): red does not fail the run</text>
  </g>
</svg>
