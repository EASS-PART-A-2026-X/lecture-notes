<text x="368" y="195" fill="#535c6b">not run</text>
<rect x="420" y="166" width="95" height="48" rx="6" fill="#f7f5ef" stroke="#3b4453" stroke-width="2" stroke-dasharray="4 3"/>
<text x="467" y="195" fill="#535c6b">not run</text>
