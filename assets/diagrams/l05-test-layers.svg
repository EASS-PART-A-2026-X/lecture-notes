<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" role="img" aria-labelledby="t d">
<title id="t">What is real in each test?</title>
<desc id="d">A grid with three test layers as rows and six parts of the product as columns, in the order a click travels: browser, Streamlit page, api.py, network, backend, SQLite. Boundary test, tests/test_boundary.py: it reads the source of the Streamlit page and runs none of the six parts. AppTest with respx, tests/test_app.py: no browser; the Streamlit page and api.py run for real, in-process; respx fakes the network and the backend with canned replies; SQLite is not run. Playwright end-to-end test, e2e/test_e2e.py: all six parts are real. Only the end-to-end row reaches the real backend and database.</desc>
<rect width="640" height="420" fill="#ffffff"/>
<g font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" fill="#0f1e3a" text-anchor="middle">
<text x="24" y="34" font-size="22" font-weight="700" text-anchor="start">What is real in each test?</text>

<g font-size="16" text-anchor="start">
<rect x="24" y="47" width="20" height="18" rx="4" fill="#f1f7f3" stroke="#2a6a47" stroke-width="2"/>
<text x="52" y="61">real: that code runs</text>
<rect x="222" y="47" width="20" height="18" rx="4" fill="#fbf6ec" stroke="#84540c" stroke-width="2"/>
<text x="250" y="61">fake: respx answers</text>
<rect x="420" y="47" width="20" height="18" rx="4" fill="#f7f5ef" stroke="#3b4453" stroke-width="2" stroke-dasharray="4 3"/>
<text x="448" y="61">not run</text>
</g>

<g font-size="16" font-weight="700">
<text x="71" y="114">browser</text>
<text x="170" y="104">Streamlit</text>
<text x="170" y="122">page</text>
<text x="269" y="114">api.py</text>
<text x="368" y="114">network</text>
<text x="467" y="114">backend</text>
<text x="566" y="114">SQLite</text>
</g>
<path d="M24 132 H614" stroke="#ddd7ca" stroke-width="2"/>

<text x="24" y="156" font-size="17" text-anchor="start"><tspan font-weight="700">Boundary test</tspan><tspan fill="#535c6b" font-size="16"> · tests/test_boundary.py</tspan></text>
<g font-size="16">
