<text x="566" y="195" fill="#535c6b">not run</text>
</g>

<text x="24" y="246" font-size="17" text-anchor="start"><tspan font-weight="700">AppTest + respx</tspan><tspan fill="#535c6b" font-size="16"> · tests/test_app.py</tspan></text>
<g font-size="16">
