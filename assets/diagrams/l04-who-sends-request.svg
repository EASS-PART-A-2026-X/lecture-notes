<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 520" role="img" aria-labelledby="t d">
<title id="t">Who sends the HTTP request to the backend?</title>
<desc id="d">Two designs side by side. Streamlit, used in this course: the browser exchanges clicks and page updates with the Streamlit server on port 8501 over a websocket; the Streamlit server, running streamlit_app.py and api.py, is the caller that sends GET /recipes to the backend on port 8000, so the backend needs no CORS settings. React with Vite, an alternative: the Vite dev server on port 5173 sends the JavaScript files to the browser once; the browser runs that JavaScript and is the caller that sends GET /recipes with an Origin header; the backend must allow that origin and the browser enforces CORS. The caller box in each design is drawn with a thick border and labelled CALLER.</desc>
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#3b4453"/></marker>
</defs>
<rect width="640" height="520" fill="#ffffff"/>
<g font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" fill="#0f1e3a" text-anchor="middle">
<text x="24" y="34" font-size="22" font-weight="700" text-anchor="start">Who sends the HTTP request?</text>
<text x="24" y="60" font-size="16" fill="#535c6b" text-anchor="start">CALLER: the process that sends the request to the backend.</text>
<path d="M320 78 V506" stroke="#ddd7ca" stroke-width="2"/>
<text x="164" y="100" font-size="18" font-weight="700">Streamlit (this course)</text>
<text x="476" y="100" font-size="18" font-weight="700">React + Vite (alternative)</text>

<rect x="36" y="116" width="256" height="80" rx="6" fill="#f7f5ef" stroke="#3b4453" stroke-width="2"/>
<text x="164" y="151" font-size="20" font-weight="700">Browser</text>
<text x="164" y="177" font-size="16" fill="#535c6b">runs none of your Python</text>

<path d="M88 202 V266" fill="none" stroke="#3b4453" stroke-width="2.5" marker-start="url(#ah)" marker-end="url(#ah)"/>
<g text-anchor="start" font-size="16"><text x="104" y="228">sends clicks, gets the</text><text x="104" y="248">page back (websocket)</text></g>

<rect x="36" y="272" width="256" height="100" rx="6" fill="#f3f6fa" stroke="#1d4e89" stroke-width="4"/>
<rect x="196" y="260" width="88" height="26" rx="6" fill="#1d4e89"/>
<text x="240" y="279" font-size="16" font-weight="700" fill="#ffffff" letter-spacing="1">CALLER</text>
<text x="164" y="312" font-size="18" font-weight="700">Streamlit server :8501</text>
<text x="164" y="337" font-size="16">runs streamlit_app.py;</text>
<text x="164" y="358" font-size="16">api.py sends the requests</text>

<path d="M120 376 V426" fill="none" stroke="#3b4453" stroke-width="2.5" marker-end="url(#ah)"/>
<text x="132" y="407" font-size="16" text-anchor="start">calls GET /recipes</text>

<rect x="36" y="432" width="256" height="72" rx="6" fill="#f7f5ef" stroke="#3b4453" stroke-width="2"/>
<text x="164" y="463" font-size="18" font-weight="700">Backend :8000</text>
<text x="164" y="488" font-size="16" fill="#2a6a47" font-weight="700">no CORS settings needed</text>

<rect x="348" y="116" width="256" height="80" rx="6" fill="#f7f5ef" stroke="#3b4453" stroke-width="2"/>
<text x="476" y="151" font-size="18" font-weight="700">Vite dev server :5173</text>
<text x="476" y="177" font-size="16" fill="#535c6b">serves your JS files</text>

<path d="M420 200 V266" fill="none" stroke="#3b4453" stroke-width="2.5" marker-end="url(#ah)"/>
<text x="432" y="238" font-size="16" text-anchor="start">sends JS files once</text>

<rect x="348" y="272" width="256" height="100" rx="6" fill="#f3f6fa" stroke="#1d4e89" stroke-width="4"/>
<rect x="508" y="260" width="88" height="26" rx="6" fill="#1d4e89"/>
<text x="552" y="279" font-size="16" font-weight="700" fill="#ffffff" letter-spacing="1">CALLER</text>
<text x="476" y="312" font-size="20" font-weight="700">Browser</text>
<text x="476" y="337" font-size="16">runs your JavaScript</text>
<text x="476" y="358" font-size="16">and enforces CORS</text>

<path d="M420 376 V426" fill="none" stroke="#3b4453" stroke-width="2.5" marker-end="url(#ah)"/>
<g text-anchor="start" font-size="16"><text x="432" y="397">calls GET /recipes,</text><text x="432" y="417">Origin: localhost:5173</text></g>

<rect x="348" y="432" width="256" height="72" rx="6" fill="#f7f5ef" stroke="#3b4453" stroke-width="2"/>
<text x="476" y="463" font-size="18" font-weight="700">Backend :8000</text>
<text x="476" y="488" font-size="16" fill="#9b2c2c" font-weight="700">must allow origin :5173</text>
</g>
</svg>
