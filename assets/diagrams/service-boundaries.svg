<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 900" role="img" aria-labelledby="title desc">
<title id="title">Recipe Box service and data boundaries</title>
<desc id="desc">A browser connects to the frontend on loopback port 8501. Inside the Compose network, the frontend calls backend port 8000 and the backend calls AI service port 8001. Only the backend accesses the database volume. Only the AI service owns model access; TestModel is in-process, while local and hosted models use an inference endpoint. The AI port is not host-published.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#334155" stroke-width="1.5"/></marker></defs>
<rect width="640" height="900" fill="#fff"/>
<g font-family="Arial, Helvetica, sans-serif" fill="#172554">
<rect x="150" y="18" width="340" height="76" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/>
<text x="320" y="50" text-anchor="middle" font-size="25" font-weight="700">Browser</text><text x="320" y="78" text-anchor="middle" font-size="20">On the student's machine</text>
<rect x="60" y="150" width="540" height="480" rx="10" fill="#f8fafc" stroke="#475569" stroke-width="2" stroke-dasharray="8 6"/>
<text x="84" y="180" font-size="21" font-weight="700">Compose network</text>
<g stroke="#334155" stroke-width="2.5" fill="none" marker-end="url(#arrow)"><path d="M320 94 V210"/><path d="M320 290 V360"/><path d="M320 440 V510"/><path d="M100 400 H24 V744 H180 V790"/><path d="M320 590 V690 H465 V790"/></g>
<g font-size="19" text-anchor="middle"><rect x="180" y="109" width="280" height="30" fill="#fff"/><text x="320" y="131">127.0.0.1:8501</text><rect x="185" y="309" width="270" height="28" fill="#f8fafc"/><text x="320" y="332">http://backend:8000</text><rect x="175" y="459" width="290" height="28" fill="#f8fafc"/><text x="320" y="482">http://ai-service:8001</text></g>
<rect x="100" y="210" width="440" height="80" rx="6" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/><text x="320" y="244" text-anchor="middle" font-size="25" font-weight="700">Frontend</text><text x="320" y="273" text-anchor="middle" font-size="20">Streamlit sends server-side HTTP</text>
<rect x="100" y="360" width="440" height="80" rx="6" fill="#f5f3ff" stroke="#6d28d9" stroke-width="2"/><text x="320" y="394" text-anchor="middle" font-size="25" font-weight="700">Backend</text><text x="320" y="423" text-anchor="middle" font-size="20">Validates and owns product state</text>
<rect x="100" y="510" width="440" height="80" rx="6" fill="#f5f3ff" stroke="#6d28d9" stroke-width="2"/><text x="320" y="544" text-anchor="middle" font-size="25" font-weight="700">AI service</text><text x="320" y="573" text-anchor="middle" font-size="20">Bounded extraction; no database write</text>
<text x="100" y="616" font-size="20">AI port not published</text>
<rect x="70" y="790" width="220" height="82" rx="8" fill="#ecfdf5" stroke="#047857" stroke-width="2"/><text x="180" y="824" text-anchor="middle" font-size="23" font-weight="700">Database volume</text><text x="180" y="853" text-anchor="middle" font-size="18">Backend access only</text>
<rect x="350" y="790" width="230" height="82" rx="8" fill="#fff7ed" stroke="#9a3412" stroke-width="2"/><text x="465" y="824" text-anchor="middle" font-size="23" font-weight="700">Model execution</text><text x="465" y="853" text-anchor="middle" font-size="17">In-process / local / hosted</text>
</g></svg>
