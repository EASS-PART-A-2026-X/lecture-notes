<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 700" role="img" aria-labelledby="t d">
  <title id="t">Should this layer retry?</title>
  <desc id="d">A decision flow for one failed call to the ai-service. 1: Did the request reach the server? If no, retry, bounded; it is free. 2: Can the operation change state? If yes, never retry blindly; tell the user to check. 3: Is the failure transient, such as a timeout, 503 or 504? If no, fail fast after one try. 4: Has another layer already retried it? If yes, fail fast; do not stack retry layers. 5: Does a retry cost money? If no, retry, bounded. If yes, retry, bounded and counted with usage limits. Every path ends with a status code and a sentence the user can act on.</desc>
  <defs>
    <marker id="ah" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0 0 L11 6 L0 12 Z" fill="#3b4453"/>
    </marker>
  </defs>
  <rect width="640" height="700" fill="#ffffff"/>
  <g font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" fill="#0f1e3a">
    <text x="24" y="36" font-size="22" font-weight="700">Should this layer retry?</text>

    <!-- start -->
    <rect x="24" y="54" width="340" height="40" rx="6" fill="#f7f5ef" stroke="#3b4453" stroke-width="2"/>
    <text x="194" y="80" font-size="18" text-anchor="middle">A call to the ai-service failed</text>

    <!-- vertical connectors with labels -->
    <g stroke="#3b4453" stroke-width="2" marker-end="url(#ah)">
      <path d="M194 94 V116"/>
      <path d="M194 174 V202"/>
      <path d="M194 260 V288"/>
      <path d="M194 346 V374"/>
      <path d="M194 432 V460"/>
      <path d="M194 518 V546"/>
    </g>
    <g font-size="16" fill="#0f1e3a">
      <text x="204" y="110">ask</text>
      <text x="204" y="194">yes, or unknown</text>
      <text x="204" y="280">no</text>
      <text x="204" y="366">yes</text>
      <text x="204" y="452">no</text>
      <text x="204" y="538">yes</text>
    </g>

    <!-- questions -->
    <g fill="#f3f6fa" stroke="#1d4e89" stroke-width="2">
      <rect x="24" y="118" width="340" height="56" rx="6"/>
      <rect x="24" y="204" width="340" height="56" rx="6"/>
      <rect x="24" y="290" width="340" height="56" rx="6"/>
      <rect x="24" y="376" width="340" height="56" rx="6"/>
      <rect x="24" y="462" width="340" height="56" rx="6"/>
    </g>
    <g font-size="18" text-anchor="middle">
      <text x="194" y="142" font-weight="700">1. Did the request reach</text>
      <text x="194" y="164">the ai-service at all?</text>
      <text x="194" y="228" font-weight="700">2. Can it change state?</text>
      <text x="194" y="250">(store a row, send, charge)</text>
      <text x="194" y="314" font-weight="700">3. Is the failure transient?</text>
      <text x="194" y="336">(a timeout, 503 or 504)</text>
      <text x="194" y="400" font-weight="700">4. Has another layer</text>
      <text x="194" y="422">already retried it?</text>
      <text x="194" y="486" font-weight="700">5. Does a retry cost money?</text>
      <text x="194" y="508">(it runs the model again)</text>
    </g>

    <!-- horizontal connectors -->
    <g stroke="#3b4453" stroke-width="2" marker-end="url(#ah)">
      <path d="M364 146 H414"/>
      <path d="M364 232 H414"/>
      <path d="M364 318 H414"/>
      <path d="M364 404 H414"/>
      <path d="M364 490 H414"/>
    </g>
    <g font-size="16" text-anchor="middle">
      <text x="388" y="139">no</text>
      <text x="388" y="225">yes</text>
      <text x="388" y="311">no</text>
      <text x="388" y="397">yes</text>
      <text x="388" y="483">no</text>
    </g>

    <!-- outcomes -->
    <rect x="418" y="118" width="198" height="56" rx="6" fill="#f1f7f3" stroke="#2a6a47" stroke-width="2"/>
    <text x="517" y="142" font-size="17" font-weight="700" fill="#2a6a47" text-anchor="middle">Retry, bounded</text>
    <text x="517" y="164" font-size="16" text-anchor="middle">free: nothing ran</text>

    <rect x="418" y="204" width="198" height="56" rx="6" fill="#fbf3f2" stroke="#9b2c2c" stroke-width="2"/>
    <text x="517" y="228" font-size="17" font-weight="700" fill="#9b2c2c" text-anchor="middle">Never retry blindly</text>
    <text x="517" y="250" font-size="16" text-anchor="middle">"may have been saved"</text>

    <rect x="418" y="290" width="198" height="56" rx="6" fill="#fbf3f2" stroke="#9b2c2c" stroke-width="2"/>
    <text x="517" y="314" font-size="17" font-weight="700" fill="#9b2c2c" text-anchor="middle">Fail fast: one try</text>
    <text x="517" y="336" font-size="16" text-anchor="middle">429, other 4xx, 500</text>

    <rect x="418" y="376" width="198" height="56" rx="6" fill="#fbf3f2" stroke="#9b2c2c" stroke-width="2"/>
    <text x="517" y="400" font-size="17" font-weight="700" fill="#9b2c2c" text-anchor="middle">Fail fast: no stacking</text>
    <text x="517" y="422" font-size="16" text-anchor="middle">502 after agent retries</text>

    <rect x="418" y="462" width="198" height="56" rx="6" fill="#f1f7f3" stroke="#2a6a47" stroke-width="2"/>
    <text x="517" y="486" font-size="17" font-weight="700" fill="#2a6a47" text-anchor="middle">Retry, bounded</text>
    <text x="517" y="508" font-size="16" text-anchor="middle">3 attempts, backoff</text>

    <rect x="24" y="548" width="340" height="56" rx="6" fill="#fbf6ec" stroke="#84540c" stroke-width="2"/>
    <text x="194" y="572" font-size="17" font-weight="700" fill="#84540c" text-anchor="middle">Retry, bounded and counted</text>
    <text x="194" y="594" font-size="16" text-anchor="middle">3 attempts, usage limits, usage logged</text>

    <!-- user sentence -->
    <rect x="24" y="624" width="592" height="62" rx="6" fill="#f7f5ef" stroke="#ddd7ca" stroke-width="2"/>
    <text x="320" y="648" font-size="16" text-anchor="middle" fill="#535c6b">Every path ends with a status code and a sentence the user can act on:</text>
    <text x="320" y="674" font-size="18" text-anchor="middle">"AI service is unavailable, try again in a minute."</text>
  </g>
</svg>
