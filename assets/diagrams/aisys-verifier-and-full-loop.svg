<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" role="img" aria-labelledby="t d">
  <title id="t">Trusted verifier six-bucket routing and the full observability chain</title>
  <desc id="d">Top band shows a locked verifier boundary sorting every sandbox attempt into four trainable RL signal buckets (correct, partial, incorrect, invalid_action) versus two excluded infrastructure or grader failure buckets (infrastructure_failure and verification_failure) that never receive reward 0. Bottom band traces the 12-link observability chain from Experiment through Run, Policy, Task, Group, Trajectory, Inference, Tool, Sandbox, Verifier, Batch, and Step alongside the four build milestones.</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L8 4.5 L1 8 Z" fill="#3b4453"/></marker>
  </defs>
  <rect width="960" height="470" fill="#ffffff"/>
  <g font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" fill="#0f1e3a">
    <text x="480" y="32" text-anchor="middle" font-size="22" font-weight="700">Trusted verifier routing (6 buckets) &amp; full observability chain</text>
    <text x="480" y="56" text-anchor="middle" font-size="15" fill="#535c6b">Separate real agent mistakes from infrastructure faults, and link every metric from experiment to weight update.</text>

    <!-- Band 1: 6 Verifier Buckets Behind Locked Boundary -->
    <rect x="24" y="76" width="912" height="196" rx="8" fill="#f1f7f3" stroke="#2a6a47" stroke-width="2"/>
    <text x="42" y="100" font-size="16" font-weight="700" fill="#2a6a47">1. Locked trusted verifier (runs outside agent disk &#x2192; 6 clean buckets)</text>

    <!-- Sandbox Box -> Boundary -> Two Lanes -->
    <rect x="42" y="144" width="128" height="68" rx="6" fill="#fbf6ec" stroke="#84540c" stroke-width="1.8"/>
    <text x="106" y="172" text-anchor="middle" font-size="13" font-weight="700" fill="#84540c">Sandbox Output</text>
    <text x="106" y="192" text-anchor="middle" font-size="12" fill="#535c6b">Cannot edit tests</text>

    <!-- Dashed Boundary -->
    <text x="196" y="116" text-anchor="middle" font-size="11" font-weight="700" fill="#1d4e89">Trust boundary</text>
    <line x1="196" y1="122" x2="196" y2="256" stroke="#1d4e89" stroke-width="2.2" stroke-dasharray="6,4"/>

    <path d="M170 162 L236 146" fill="none" stroke="#2a6a47" stroke-width="2" marker-end="url(#arrow)"/>
    <path d="M170 192 L236 226" fill="none" stroke="#9b2c2c" stroke-width="2" marker-end="url(#arrow)"/>

    <!-- Lane A: Trainable Signal (4 buckets) -->
    <g text-anchor="middle" font-size="12">
      <rect x="242" y="122" width="112" height="52" rx="5" fill="#ffffff" stroke="#2a6a47" stroke-width="1.5"/>
      <text x="298" y="144" font-weight="700" fill="#2a6a47">correct</text>
      <text x="298" y="162" fill="#535c6b">+ reward</text>

      <rect x="364" y="122" width="112" height="52" rx="5" fill="#ffffff" stroke="#22616b" stroke-width="1.5"/>
      <text x="420" y="144" font-weight="700" fill="#22616b">partial</text>
      <text x="420" y="162" fill="#535c6b">milestone +/&#x2212;</text>

      <rect x="486" y="122" width="112" height="52" rx="5" fill="#ffffff" stroke="#84540c" stroke-width="1.5"/>
      <text x="542" y="144" font-weight="700" fill="#84540c">incorrect</text>
      <text x="542" y="162" fill="#535c6b">&#x2212; reward</text>

      <rect x="608" y="122" width="128" height="52" rx="5" fill="#ffffff" stroke="#84540c" stroke-width="1.5"/>
      <text x="672" y="144" font-weight="700" fill="#84540c">invalid_action</text>
      <text x="672" y="162" fill="#535c6b">format/policy pen.</text>
    </g>
    <path d="M736 148 H764" fill="none" stroke="#2a6a47" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="770" y="124" width="148" height="48" rx="6" fill="#2a6a47"/>
    <text x="844" y="146" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">Admit to RL</text>
    <text x="844" y="162" text-anchor="middle" font-size="11" fill="#f1f7f3">Valid learning signal</text>

    <!-- Lane B: Excluded Faults (2 buckets) -->
    <g text-anchor="middle" font-size="12">
      <rect x="242" y="198" width="234" height="54" rx="5" fill="#fbf3f2" stroke="#9b2c2c" stroke-width="1.5"/>
      <text x="359" y="220" font-weight="700" fill="#9b2c2c">infrastructure_failure</text>
      <text x="359" y="238" fill="#535c6b">Host OOM / disk crash &#x2192; retry</text>

      <rect x="486" y="198" width="250" height="54" rx="5" fill="#fbf3f2" stroke="#9b2c2c" stroke-width="1.5"/>
      <text x="611" y="220" font-weight="700" fill="#9b2c2c">verification_failure</text>
      <text x="611" y="238" fill="#535c6b">Broken grader/test &#x2192; alert engineer</text>
    </g>
    <path d="M736 225 H764" fill="none" stroke="#9b2c2c" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="770" y="200" width="148" height="50" rx="6" fill="#9b2c2c"/>
    <text x="844" y="222" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">Exclude cleanly</text>
    <text x="844" y="238" text-anchor="middle" font-size="11" fill="#fbf3f2">Never assign reward 0</text>

    <!-- Band 2: 12-Link Trace Chain + 4 Milestones -->
    <rect x="24" y="288" width="912" height="162" rx="8" fill="#f7f5ef" stroke="#3b4453" stroke-width="2"/>
    <text x="42" y="312" font-size="16" font-weight="700">2. Full 12-link trace chain &amp; 4-milestone build roadmap</text>

    <!-- Row 1 of Trace Chain (6 pills w=130, gap=18: x=42, 190, 338, 486, 634, 782) -->
    <g text-anchor="middle" font-size="12" font-weight="700">
      <rect x="42" y="324" width="130" height="28" rx="5" fill="#ffffff" stroke="#1d4e89" stroke-width="1.3"/><text x="107" y="342" fill="#1d4e89">1. Experiment</text>
      <rect x="190" y="324" width="130" height="28" rx="5" fill="#ffffff" stroke="#1d4e89" stroke-width="1.3"/><text x="255" y="342" fill="#1d4e89">2. Run</text>
      <rect x="338" y="324" width="130" height="28" rx="5" fill="#ffffff" stroke="#1d4e89" stroke-width="1.3"/><text x="403" y="342" fill="#1d4e89">3. Policy &#x3B8;_v</text>
      <rect x="486" y="324" width="130" height="28" rx="5" fill="#ffffff" stroke="#22616b" stroke-width="1.3"/><text x="551" y="342" fill="#22616b">4. Task</text>
      <rect x="634" y="324" width="130" height="28" rx="5" fill="#ffffff" stroke="#22616b" stroke-width="1.3"/><text x="699" y="342" fill="#22616b">5. GRPO Group</text>
      <rect x="782" y="324" width="136" height="28" rx="5" fill="#ffffff" stroke="#22616b" stroke-width="1.3"/><text x="850" y="342" fill="#22616b">6. Trajectory</text>
    </g>
    <g fill="none" stroke="#3b4453" stroke-width="1.6" marker-end="url(#arrow)">
      <path d="M172 338 H186"/><path d="M320 338 H334"/><path d="M468 338 H482"/><path d="M616 338 H630"/><path d="M764 338 H778"/>
    </g>

    <!-- Row 2 of Trace Chain -->
    <g text-anchor="middle" font-size="12" font-weight="700">
      <rect x="42" y="364" width="130" height="28" rx="5" fill="#ffffff" stroke="#22616b" stroke-width="1.3"/><text x="107" y="382" fill="#22616b">7. Inference</text>
      <rect x="190" y="364" width="130" height="28" rx="5" fill="#ffffff" stroke="#84540c" stroke-width="1.3"/><text x="255" y="382" fill="#84540c">8. Tool Call</text>
      <rect x="338" y="364" width="130" height="28" rx="5" fill="#ffffff" stroke="#84540c" stroke-width="1.3"/><text x="403" y="382" fill="#84540c">9. Sandbox E_t</text>
      <rect x="486" y="364" width="130" height="28" rx="5" fill="#ffffff" stroke="#2a6a47" stroke-width="1.3"/><text x="551" y="382" fill="#2a6a47">10. Verifier</text>
      <rect x="634" y="364" width="130" height="28" rx="5" fill="#ffffff" stroke="#1d4e89" stroke-width="1.3"/><text x="699" y="382" fill="#1d4e89">11. Batch</text>
      <rect x="782" y="364" width="136" height="28" rx="5" fill="#1d4e89"/><text x="850" y="382" fill="#ffffff">12. Step &#x3B8;_{v+1}</text>
    </g>
    <g fill="none" stroke="#3b4453" stroke-width="1.6" marker-end="url(#arrow)">
      <path d="M172 378 H186"/><path d="M320 378 H334"/><path d="M468 378 H482"/><path d="M616 378 H630"/><path d="M764 378 H778"/>
    </g>

    <!-- Bottom Roadmap Bar -->
    <rect x="42" y="406" width="876" height="32" rx="6" fill="#ffffff" stroke="#ddd7ca" stroke-width="1.2"/>
    <text x="480" y="427" text-anchor="middle" font-size="13" font-weight="700" fill="#3b4453">4 Milestones: M1 Parity &#x2192; M2 Sandboxes + Verifier &#x2192; M3 Sync/Async RL &#x2192; M4 CoW Forks &#xB7; Metrics: MFU, TTFT, lag, $/success</text>
  </g>
</svg>
