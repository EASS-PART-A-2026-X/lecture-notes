<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 600" role="img" aria-labelledby="t d">
<title id="t">Who reads each artifact, and what enforces it</title>
<desc id="d">Six rows, each read left to right: the artifact that declares something, the consumer that reads it, and the enforcement point that can refuse a violation. Row 1: a task YAML with network: denied is read by your runner, if one exists; nothing enforces it unless that runner does. Row 2: a Dockerfile with USER appuser is read by docker build; the container runtime starts the container as that user. Row 3: compose.yaml with 127.0.0.1:8000 is read by Docker Compose; Docker enforces the loopback port binding, the healthcheck and the volume. Row 4: a CI workflow with permissions: is read by the GitHub Actions runner; GitHub enforces the token permissions. Row 5: AGENTS.md project guidance is read by the coding harness and its model; nothing enforces it, because guidance is not a control. Row 6: SKILL.md with allowed-tools is read by the harness's skill loader; only the harness's permission rules or an operating-system sandbox restrict tools, because allowed-tools pre-approves tools and does not remove any. Green enforcement boxes can refuse; red boxes mean only text.</desc>
<defs>
<marker id="an" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L9 5 L1 9 Z" fill="#3b4453"/></marker>
</defs>
<rect width="640" height="600" fill="#ffffff"/>
<g font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" fill="#0f1e3a" text-anchor="middle">
<text x="320" y="30" font-size="20" font-weight="700">Who reads it, and what actually enforces it?</text>
<text x="320" y="54" font-size="16" fill="#535c6b">A file declares. A consumer reads. Only an enforcement point refuses.</text>

<!-- column heads -->
<g font-size="16" font-weight="700">
<text x="88" y="90">Declared in</text>
<text x="300" y="90">→ read by</text>
<text x="532" y="90">→ enforced by</text>
</g>

