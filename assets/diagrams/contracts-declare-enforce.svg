<text x="300" y="131">your runner,</text><text x="300" y="153">if one exists</text>
<text x="300" y="197">docker build</text><text x="300" y="219">(image builder)</text>
<text x="300" y="263">Docker Compose</text><text x="300" y="285">(compose up)</text>
