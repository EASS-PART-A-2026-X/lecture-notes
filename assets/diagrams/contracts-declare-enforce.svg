<rect x="436" y="174" width="192" height="56" rx="6"/>
<rect x="436" y="240" width="192" height="56" rx="6"/>
<rect x="436" y="306" width="192" height="56" rx="6"/>
<rect x="436" y="438" width="192" height="56" rx="6"/>
</g>
<g font-size="16">
<text x="532" y="131" font-weight="700" fill="#9b2c2c">none, unless that</text><text x="532" y="153" fill="#9b2c2c">runner enforces it</text>
<text x="532" y="197" font-weight="700" fill="#2a6a47">container runtime</text><text x="532" y="219">starts it as that user</text>
<text x="532" y="263" font-weight="700" fill="#2a6a47">Docker</text><text x="532" y="285">port bind, health, volume</text>
<text x="532" y="329" font-weight="700" fill="#2a6a47">GitHub</text><text x="532" y="351">token permissions</text>
<text x="532" y="395" font-weight="700" fill="#9b2c2c">none: guidance</text><text x="532" y="417" fill="#9b2c2c">is not a control</text>
<text x="532" y="461" font-weight="700" fill="#2a6a47">permission rules</text><text x="532" y="483">or an OS sandbox</text>
</g>

<!-- notes -->
<g font-size="16" text-anchor="start">
<text x="12" y="524"><tspan font-weight="700">allowed-tools</tspan> pre-approves tools; it does not remove any.</text>
<text x="12" y="548"><tspan font-weight="700">depends_on</tspan> orders startup only; an unpublished port is not a login.</text>
</g>
<g font-size="16" text-anchor="start">
<rect x="12" y="566" width="22" height="18" rx="4" fill="#f1f7f3" stroke="#2a6a47" stroke-width="2"/>
<text x="42" y="581">can refuse a violation</text>
<rect x="240" y="566" width="22" height="18" rx="4" fill="#fbf3f2" stroke="#9b2c2c" stroke-width="2"/>
<text x="270" y="581">text only: nothing refuses</text>
</g>
</g>
</svg>
