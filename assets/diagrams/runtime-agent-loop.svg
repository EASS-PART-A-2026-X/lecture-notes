<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 700" role="img" aria-labelledby="t d">
  <title id="t">One agent run: the model proposes, your code decides</title>
  <desc id="d">POST /extract starts extract_agent.run. Each model request sends the instructions, the tool schemas and the whole history so far; in the retry test the history grows from 1 to 3 to 5 messages. The model's response proposes either a tool call or the final_result call. A tool call goes to your tool code, which checks the arguments and runs the function; its return is appended and the next model request is sent. Bad arguments or a ModelRetry from the tool send a retry prompt back to the model instead. Any other exception in the tool stops the run. A final_result call goes to the output checks: the schema, then your output validators such as check_tags. If a check fails, a retry prompt goes back to the model; when retries are exhausted the run stops with UnexpectedModelBehavior. A valid output becomes a typed RecipeExtraction returned as JSON; the backend saves it later. A stopped run is HTTP 500 today; Lecture 9 maps it to a clear status. Dashed arrows are retry prompts, and each one costs one more model request.</desc>
  <defs>
    <marker id="ak" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0 L11 6 L0 12 Z" fill="#3b4453"/></marker>
    <marker id="an" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0 L11 6 L0 12 Z" fill="#1d4e89"/></marker>
    <marker id="ao" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0 L11 6 L0 12 Z" fill="#84540c"/></marker>
    <marker id="ax" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0 L11 6 L0 12 Z" fill="#9b2c2c"/></marker>
    <marker id="ag" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0 L11 6 L0 12 Z" fill="#2a6a47"/></marker>
  </defs>
  <rect width="640" height="700" fill="#ffffff"/>
  <g font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" fill="#0f1e3a">
    <text x="24" y="34" font-size="20" font-weight="700">One agent run: the model proposes, your code decides</text>

    <!-- entry -->
    <rect x="170" y="50" width="300" height="54" rx="6" fill="#f7f5ef" stroke="#3b4453" stroke-width="2"/>
    <text x="320" y="73" font-size="18" font-weight="700" text-anchor="middle">POST /extract</text>
    <text x="320" y="95" font-size="16" text-anchor="middle">extract_agent.run(text, deps)</text>
    <path d="M320 104 V126" fill="none" stroke="#3b4453" stroke-width="2.5" marker-end="url(#ak)"/>
    <text x="330" y="122" font-size="16">starts a run</text>

    <!-- model request / response -->
    <rect x="170" y="130" width="300" height="104" rx="6" fill="#eff6f6" stroke="#22616b" stroke-width="2"/>
    <text x="320" y="156" font-size="19" font-weight="700" text-anchor="middle">Model request → response</text>
    <text x="320" y="180" font-size="16" text-anchor="middle">sends instructions, tool schemas</text>
    <text x="320" y="200" font-size="16" text-anchor="middle">and the whole history so far;</text>
    <text x="320" y="222" font-size="16" text-anchor="middle">replies with one proposal</text>

    <!-- history panel -->
    <rect x="486" y="130" width="130" height="90" rx="6" fill="#f7f5ef" stroke="#ddd7ca" stroke-width="2"/>
    <text x="496" y="151" font-size="16" fill="#535c6b">history sent</text>
    <g font-size="16">
      <text x="496" y="173">req 1</text>
      <text x="496" y="193">req 2</text>
      <text x="496" y="213">req 3</text>
    </g>
    <g fill="#22616b">
      <rect x="544" y="161" width="10" height="12" rx="2"/>
      <rect x="544" y="181" width="10" height="12" rx="2"/><rect x="557" y="181" width="10" height="12" rx="2"/><rect x="570" y="181" width="10" height="12" rx="2"/>
      <rect x="544" y="201" width="10" height="12" rx="2"/><rect x="557" y="201" width="10" height="12" rx="2"/><rect x="570" y="201" width="10" height="12" rx="2"/><rect x="583" y="201" width="10" height="12" rx="2"/><rect x="596" y="201" width="10" height="12" rx="2"/>
    </g>

    <!-- branches -->
    <g fill="none" stroke="#1d4e89" stroke-width="2.5" marker-end="url(#an)">
      <path d="M260 234 V280"/>
      <path d="M400 234 V280"/>
      <path d="M40 284 V176 H166"/>
    </g>
    <text x="268" y="262" font-size="16">tool call</text>
    <text x="408" y="274" font-size="16">final_result call</text>
    <text x="48" y="150" font-size="16" fill="#1d4e89">tool return</text>
    <text x="48" y="168" font-size="16" fill="#1d4e89">appended</text>

    <!-- tool code -->
    <rect x="24" y="284" width="272" height="112" rx="6" fill="#f3f6fa" stroke="#1d4e89" stroke-width="2"/>
    <text x="160" y="310" font-size="19" font-weight="700" text-anchor="middle">Your tool code</text>
    <text x="160" y="334" font-size="16" text-anchor="middle">checks the arguments, then</text>
    <text x="160" y="356" font-size="16" text-anchor="middle">runs allowed_tags() or</text>
    <text x="160" y="378" font-size="16" text-anchor="middle">hours_to_minutes()</text>

    <!-- output checks -->
    <rect x="344" y="284" width="272" height="112" rx="6" fill="#f3f6fa" stroke="#1d4e89" stroke-width="2"/>
    <text x="480" y="310" font-size="19" font-weight="700" text-anchor="middle">Output checks</text>
    <text x="480" y="334" font-size="16" text-anchor="middle">1. schema: RecipeExtraction</text>
    <text x="480" y="356" font-size="16" text-anchor="middle">2. your output validators</text>
    <text x="480" y="378" font-size="16" text-anchor="middle">(check_tags)</text>

    <!-- retry prompts -->
    <g fill="none" stroke="#84540c" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#ao)">
      <path d="M100 284 V218 H166"/>
      <path d="M600 284 V228 H474"/>
    </g>
    <text x="108" y="244" font-size="16" fill="#84540c">bad args or</text>
    <text x="108" y="262" font-size="16" fill="#84540c">ModelRetry</text>
    <text x="592" y="252" font-size="16" fill="#84540c" text-anchor="end">check fails</text>

    <!-- valid -->
    <path d="M528 396 V448" fill="none" stroke="#2a6a47" stroke-width="2.5" marker-end="url(#ag)"/>
    <text x="536" y="428" font-size="16" font-weight="700" fill="#2a6a47">valid</text>
    <rect x="440" y="452" width="176" height="104" rx="6" fill="#f1f7f3" stroke="#2a6a47" stroke-width="2"/>
    <text x="528" y="478" font-size="19" font-weight="700" fill="#2a6a47" text-anchor="middle">Typed result</text>
    <text x="528" y="500" font-size="16" text-anchor="middle">RecipeExtraction,</text>
    <text x="528" y="520" font-size="16" text-anchor="middle">returned as JSON;</text>
    <text x="528" y="542" font-size="16" text-anchor="middle">backend saves it later</text>

    <!-- failure paths -->
    <g fill="none" stroke="#9b2c2c" stroke-width="2.5" marker-end="url(#ax)">
      <path d="M160 396 V580"/>
      <path d="M400 396 V580"/>
    </g>
    <text x="168" y="440" font-size="16" fill="#9b2c2c">other exception, or</text>
    <text x="168" y="458" font-size="16" fill="#9b2c2c">tool retries used up</text>
    <text x="392" y="500" font-size="16" fill="#9b2c2c" text-anchor="end">retries</text>
    <text x="392" y="518" font-size="16" fill="#9b2c2c" text-anchor="end">exhausted</text>

    <rect x="24" y="584" width="592" height="80" rx="6" fill="#fbf3f2" stroke="#9b2c2c" stroke-width="2"/>
    <text x="320" y="610" font-size="19" font-weight="700" fill="#9b2c2c" text-anchor="middle">The run stops: nothing to save</text>
    <text x="320" y="634" font-size="16" text-anchor="middle">UnexpectedModelBehavior, or the tool's own exception</text>
    <text x="320" y="654" font-size="16" text-anchor="middle">HTTP 500 today; Lecture 9 maps it to a clear status</text>

    <!-- legend -->
    <path d="M24 682 H56" stroke="#1d4e89" stroke-width="2.5"/>
    <text x="62" y="687" font-size="16">normal step</text>
    <path d="M170 682 H202" stroke="#84540c" stroke-width="2.5" stroke-dasharray="7 5"/>
    <text x="208" y="687" font-size="16">retry prompt: one more model request</text>
  </g>
</svg>
