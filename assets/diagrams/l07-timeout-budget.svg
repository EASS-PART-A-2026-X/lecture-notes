<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 620" role="img" aria-labelledby="t d">
<title id="t">Who gives up first: the timeout budget across hops</title>
<desc id="d">Timeline of one paste in three cases, with the frontend's 100 second read limit and the backend's 30 second read limit. Case 1, normal: the AI service answers in seconds, the backend saves the recipe and returns 201. Case 2, the AI service accepts the connection but never answers: at 30 seconds the backend's read timeout fires and it returns 503, and the frontend shows that the AI service is unavailable. Case 3, the backend's timeout is removed: at 100 seconds the frontend gives up and tells the user the change may have been saved, while the backend keeps waiting and holds a worker thread.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#84540c" stroke-width="2"/></marker></defs>
<rect width="640" height="620" fill="#ffffff"/>
<g font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" fill="#0f1e3a">
<text x="20" y="36" font-size="21" font-weight="700">Who gives up first? One paste, three cases</text>
<text x="20" y="62" font-size="16" fill="#535c6b">Read limits: frontend 100 s, backend 30 s (connect 2 s each)</text>
<!-- time axis -->
<g stroke="#3b4453" stroke-width="2"><path d="M160 98 H600"/><path d="M160 92 V104"/><path d="M274 92 V104"/><path d="M540 92 V104"/></g>
<g font-size="16" text-anchor="middle"><text x="160" y="86">0 s</text><text x="274" y="86">30 s</text><text x="540" y="86">100 s</text></g>
<text x="620" y="86" font-size="16" text-anchor="end" fill="#535c6b">time →</text>
<g stroke="#ddd7ca" stroke-width="2" stroke-dasharray="6 6"><path d="M274 104 V112"/><path d="M540 104 V112"/><path d="M274 262 V556"/><path d="M540 262 V556"/></g>
<!-- lane labels -->
<g font-size="16">
<text x="20" y="165">Frontend</text><text x="20" y="197">Backend</text><text x="20" y="229">AI service</text>
<text x="20" y="315">Frontend</text><text x="20" y="347">Backend</text><text x="20" y="379">AI service</text>
<text x="20" y="465">Frontend</text><text x="20" y="497">Backend</text><text x="20" y="529">AI service</text>
</g>
<!-- case 1 -->
<rect x="14" y="112" width="612" height="136" rx="6" fill="none" stroke="#ddd7ca" stroke-width="2"/>
<text x="20" y="134" font-size="18" font-weight="700">1. Normal: the model answers</text>
<rect x="160" y="148" width="20" height="24" rx="3" fill="#f3f6fa" stroke="#1d4e89" stroke-width="2"/>
<rect x="160" y="180" width="18" height="24" rx="3" fill="#f3f6fa" stroke="#1d4e89" stroke-width="2"/>
<rect x="160" y="212" width="14" height="24" rx="3" fill="#eff6f6" stroke="#22616b" stroke-width="2"/>
<g font-size="16"><text x="192" y="165">gets 201: “Added … from your text.”</text><text x="192" y="197">validates, then saves the recipe</text><text x="192" y="229">answers within seconds</text></g>
<!-- case 2 -->
<rect x="14" y="262" width="612" height="136" rx="6" fill="none" stroke="#ddd7ca" stroke-width="2"/>
<text x="20" y="284" font-size="18" font-weight="700">2. The AI service never answers</text>
<rect x="160" y="298" width="114" height="24" rx="3" fill="#f3f6fa" stroke="#1d4e89" stroke-width="2"/>
<rect x="160" y="330" width="114" height="24" rx="3" fill="#f3f6fa" stroke="#1d4e89" stroke-width="2"/>
<rect x="271" y="326" width="6" height="32" fill="#9b2c2c"/>
<rect x="160" y="362" width="460" height="24" rx="3" fill="#eff6f6" stroke="#22616b" stroke-width="2" stroke-dasharray="7 5"/>
<g font-size="16"><text x="286" y="315">shows “AI service is unavailable…”</text><text x="286" y="347" fill="#9b2c2c" font-weight="700">read timeout at 30 s → 503</text><text x="290" y="379">accepts the connection, sends nothing</text></g>
<!-- case 3 -->
<rect x="14" y="412" width="612" height="136" rx="6" fill="none" stroke="#ddd7ca" stroke-width="2"/>
<text x="20" y="434" font-size="18" font-weight="700">3. Backend timeout removed: Timeout(None)</text>
<rect x="160" y="448" width="380" height="24" rx="3" fill="#f3f6fa" stroke="#1d4e89" stroke-width="2"/>
<rect x="537" y="444" width="6" height="32" fill="#9b2c2c"/>
<rect x="160" y="480" width="440" height="24" rx="3" fill="#fbf6ec" stroke="#84540c" stroke-width="2"/>
<path d="M600 492 H616" stroke="#84540c" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="160" y="512" width="460" height="24" rx="3" fill="#eff6f6" stroke="#22616b" stroke-width="2" stroke-dasharray="7 5"/>
<g font-size="16"><text x="170" y="465"><tspan fill="#9b2c2c" font-weight="700">gives up at 100 s:</tspan> “may have been saved”</text><text x="170" y="497">still waiting, holds a worker thread</text><text x="290" y="529">accepts the connection, sends nothing</text></g>
<!-- legend -->
<g font-size="16">
<rect x="20" y="566" width="26" height="16" rx="3" fill="#f3f6fa" stroke="#1d4e89" stroke-width="2"/><text x="54" y="580">waiting for a reply</text>
<rect x="250" y="566" width="26" height="16" rx="3" fill="#eff6f6" stroke="#22616b" stroke-width="2" stroke-dasharray="7 5"/><text x="284" y="580">connected, sends nothing</text>
<rect x="20" y="592" width="26" height="16" rx="3" fill="#fbf6ec" stroke="#84540c" stroke-width="2"/><text x="54" y="606">waiting with no limit</text>
<rect x="257" y="588" width="6" height="24" fill="#9b2c2c"/><text x="284" y="606">gives up here (a timeout fires)</text>
</g>
</g>
</svg>
