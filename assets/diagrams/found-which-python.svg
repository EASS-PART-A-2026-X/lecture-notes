<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 502" role="img" aria-labelledby="t d">
<title id="t">Which Python runs your code?</title>
<desc id="d">Four ways to start the backend, each mapped to the interpreter it uses. A terminal in backend/ running uv run fastapi dev finds backend/pyproject.toml and uses backend/.venv with packages from uv.lock: correct. A terminal in the repository root running the same command finds no pyproject.toml and fails with Failed to spawn: fastapi. A container started with docker compose up runs the code and packages copied into the image at build time, so edits appear only after rebuilding with --build. The editor's Run button and its red or green squiggles use whichever interpreter the editor has selected, which may differ from uv run. To check, run uv run python -c "import sys; print(sys.executable)" from the same folder.</desc>
<defs><marker id="an" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L9 5 L1 9 Z" fill="#1d4e89"/></marker></defs>
<rect width="640" height="502" fill="#ffffff"/>
<g font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" fill="#0f1e3a" text-anchor="middle">
<text x="320" y="28" font-size="20" font-weight="700">Which Python runs your code?</text>
<text x="320" y="52" font-size="16" fill="#535c6b">The folder and the tool choose the interpreter and its packages.</text>
<text x="126" y="84" font-size="16" font-weight="700" fill="#535c6b">YOU START IT FROM</text>
<text x="504" y="84" font-size="16" font-weight="700" fill="#535c6b">IT RUNS WITH</text>
<rect x="16" y="96" width="220" height="64" rx="6" fill="#f7f5ef" stroke="#3b4453" stroke-width="2"/>
<text x="126" y="123" font-size="18" font-weight="700">Terminal in backend/</text>
<text x="126" y="146" font-size="16" fill="#535c6b">uv run fastapi dev</text>
<path d="M238 128 H380" stroke="#1d4e89" stroke-width="2.5" fill="none" marker-end="url(#an)"/>
<text x="310" y="119" font-size="16" fill="#1d4e89">finds</text>
<text x="310" y="149" font-size="16" fill="#1d4e89">pyproject.toml</text>
<rect x="384" y="96" width="240" height="64" rx="6" fill="#f1f7f3" stroke="#2a6a47" stroke-width="2"/>
<text x="504" y="123" font-size="18" font-weight="700" fill="#2a6a47">OK · backend/.venv</text>
<text x="504" y="146" font-size="16">packages from uv.lock</text>
<rect x="16" y="178" width="220" height="64" rx="6" fill="#f7f5ef" stroke="#3b4453" stroke-width="2"/>
<text x="126" y="205" font-size="18" font-weight="700">Terminal in repo root</text>
<text x="126" y="228" font-size="16" fill="#535c6b">uv run fastapi dev</text>
<path d="M238 210 H380" stroke="#1d4e89" stroke-width="2.5" fill="none" marker-end="url(#an)"/>
<text x="310" y="201" font-size="16" fill="#1d4e89">finds no</text>
<text x="310" y="231" font-size="16" fill="#1d4e89">pyproject.toml</text>
<rect x="384" y="178" width="240" height="64" rx="6" fill="#fbf3f2" stroke="#9b2c2c" stroke-width="2"/>
<text x="504" y="205" font-size="18" font-weight="700" fill="#9b2c2c">Fails · no project</text>
<text x="504" y="228" font-size="16">Failed to spawn: fastapi</text>
<rect x="16" y="260" width="220" height="64" rx="6" fill="#f7f5ef" stroke="#3b4453" stroke-width="2"/>
<text x="126" y="287" font-size="18" font-weight="700">A container</text>
<text x="126" y="310" font-size="16" fill="#535c6b">docker compose up</text>
<path d="M238 292 H380" stroke="#1d4e89" stroke-width="2.5" fill="none" marker-end="url(#an)"/>
<text x="310" y="283" font-size="16" fill="#1d4e89">runs what was</text>
<text x="310" y="313" font-size="16" fill="#1d4e89">copied at build</text>
<rect x="384" y="260" width="240" height="64" rx="6" fill="#fbf6ec" stroke="#84540c" stroke-width="2"/>
<text x="504" y="287" font-size="18" font-weight="700" fill="#84540c">Check · image's Python</text>
<text x="504" y="310" font-size="16">edits need --build</text>
<rect x="16" y="342" width="220" height="64" rx="6" fill="#f7f5ef" stroke="#3b4453" stroke-width="2"/>
<text x="126" y="369" font-size="18" font-weight="700">Editor Run or lint</text>
<text x="126" y="392" font-size="16" fill="#535c6b">green or red squiggles</text>
<path d="M238 374 H380" stroke="#1d4e89" stroke-width="2.5" fill="none" marker-end="url(#an)"/>
<text x="310" y="365" font-size="16" fill="#1d4e89">uses the</text>
<text x="310" y="395" font-size="16" fill="#1d4e89">selected Python</text>
<rect x="384" y="342" width="240" height="64" rx="6" fill="#fbf6ec" stroke="#84540c" stroke-width="2"/>
<text x="504" y="369" font-size="18" font-weight="700" fill="#84540c">Check · editor's Python</text>
<text x="504" y="392" font-size="16">may differ from uv run</text>
<rect x="16" y="424" width="608" height="66" rx="6" fill="#f3f6fa" stroke="#1d4e89" stroke-width="2"/>
<text x="320" y="450" font-size="18" font-weight="700" fill="#1d4e89">Check which one ran, from the same folder:</text>
<text x="320" y="475" font-size="16">uv run python -c "import sys; print(sys.executable)"</text>
</g>
</svg>
