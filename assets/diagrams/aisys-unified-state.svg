<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" role="img" aria-labelledby="t d">
  <title id="t">The rewind wall: local sandbox state versus external world</title>
  <desc id="d">A dashed vertical sandbox wall separates local state on the left that can be rewound or forked (files E_t, KV scratchpad K_t, token log H_t, and policy version theta_v) from external side effects on the right that cannot be undone by disk snapshots (sent emails, remote database rows, payment API calls). At the bottom, a locked verifier sits outside the agent disk to separate wrong answers from broken sandboxes.</desc>
  <rect width="640" height="480" fill="#ffffff"/>
  <g font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" fill="#0f1e3a">
    <text x="320" y="32" text-anchor="middle" font-size="22" font-weight="700">The Rewind Wall: what snapshots can undo</text>
    <text x="320" y="56" text-anchor="middle" font-size="16" fill="#535c6b">State S_t = (θ_v, K_t, H_t, E_t, Q_t, R_t)</text>

    <!-- Left Box: CAN Rewind -->
    <rect x="24" y="76" width="276" height="254" rx="6" fill="#f3f6fa" stroke="#1d4e89" stroke-width="2"/>
    <text x="162" y="106" text-anchor="middle" font-size="18" font-weight="700" fill="#1d4e89">Inside: CAN rewind</text>
    <text x="42" y="142" font-size="16"><tspan font-weight="700">E_t:</tspan> local sandbox files</text>
    <text x="42" y="174" font-size="16"><tspan font-weight="700">K_t:</tspan> KV scratchpad</text>
    <text x="42" y="206" font-size="16"><tspan font-weight="700">H_t:</tspan> exact token IDs</text>
    <text x="42" y="238" font-size="16"><tspan font-weight="700">θ_v:</tspan> pinned policy version</text>
    <text x="42" y="270" font-size="16"><tspan font-weight="700">Q_t, R_t:</tspan> queue &amp; RNG seed</text>
    <text x="162" y="310" text-anchor="middle" font-size="16" fill="#535c6b">Snapshot &amp; fork safely</text>

    <!-- Vertical Dashed Wall -->
    <line x1="320" y1="76" x2="320" y2="334" stroke="#3b4453" stroke-width="2.5" stroke-dasharray="6 4"/>

    <!-- Right Box: CANNOT Rewind -->
    <rect x="340" y="76" width="276" height="254" rx="6" fill="#fbf3f2" stroke="#9b2c2c" stroke-width="2"/>
    <text x="478" y="106" text-anchor="middle" font-size="18" font-weight="700" fill="#9b2c2c">Outside: CANNOT rewind</text>
    <text x="358" y="146" font-size="16">• Email already sent</text>
    <text x="358" y="182" font-size="16">• Remote database row</text>
    <text x="358" y="218" font-size="16">• Payment or webhook</text>
    <text x="358" y="264" font-size="16" fill="#535c6b">Needs idempotency keys</text>
    <text x="478" y="310" text-anchor="middle" font-size="16" font-weight="700" fill="#9b2c2c">Disk rewind fails here</text>

    <!-- Bottom Locked Verifier -->
    <rect x="24" y="354" width="592" height="102" rx="6" fill="#f1f7f3" stroke="#2a6a47" stroke-width="2"/>
    <text x="320" y="384" text-anchor="middle" font-size="18" font-weight="700" fill="#2a6a47">Locked Verifier Boundary (outside agent disk)</text>
    <text x="320" y="414" text-anchor="middle" font-size="16">Hidden tests run here — agent code cannot edit them</text>
    <text x="320" y="440" text-anchor="middle" font-size="16" fill="#535c6b">Separates wrong answers from broken sandboxes</text>
  </g>
</svg>
