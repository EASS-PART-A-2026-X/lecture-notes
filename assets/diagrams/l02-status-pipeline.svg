<text x="394" y="217">loc ["body", 31]</text>
<text x="394" y="307">loc[0]: path, query or body</text>
<text x="394" y="330">your handler never ran</text>
<text x="394" y="429">the HTTPException you raised</text>
<text x="394" y="489">traceback only in server log</text>
<text x="394" y="580">status_code on the route</text>
<text x="394" y="601">body: what you returned</text>
</g>
