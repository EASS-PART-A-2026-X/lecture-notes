<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 700" role="img" aria-labelledby="t d">
<title id="t">Where does this status code come from?</title>
<desc id="d">FastAPI handles a request in five stages and answers at the first one that fails. 1. Match the path and method: no route with this path gives 404 with detail "Not Found"; the path with another method gives 405 "Method Not Allowed". 2. Parse the JSON body, only for routes that take a body: invalid JSON gives 422 json_invalid with loc body and a character position. 3. Resolve inputs: the dependency get_store runs, path and query parameters are converted and checked against their limits, and the body is validated against the Pydantic model; all errors are reported together in one 422 whose loc starts with path, query or body, and the handler never runs. 4. Run your handler: get_or_404 raises HTTPException 404 "Recipe not found"; any uncaught exception becomes 500 Internal Server Error with the traceback only in the server log. 5. Build the response: the return value is serialized through the return type RecipePublic, which filters fields but does not re-validate a model object; the status is 200, 201 or 204 as declared on the route.</desc>
<defs>
<marker id="an" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L9 5 L1 9 Z" fill="#1d4e89"/></marker>
<marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L9 5 L1 9 Z" fill="#9b2c2c"/></marker>
<marker id="ag" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L9 5 L1 9 Z" fill="#2a6a47"/></marker>
</defs>
