<g font-size="18" font-weight="700">
<text x="34" y="104">1. Match path and method</text>
<text x="34" y="195">2. Parse the JSON body</text>
<text x="34" y="281">3. Resolve the inputs</text>
<text x="34" y="412">4. Run your handler</text>
<text x="34" y="552">5. Build the response</text>
</g>
<g font-size="16" fill="#535c6b">
<text x="34" y="128">the routes you declared</text>
<text x="34" y="217">only routes that take a body</text>
<text x="34" y="305">Depends(get_store) runs</text>
<text x="34" y="327">path, query: types and limits</text>
<text x="34" y="349">body: your Pydantic model</text>
<text x="34" y="437">get_or_404, then your code</text>
<text x="34" y="459">a bug in here becomes a 500</text>
<text x="34" y="577">return value → RecipePublic</text>
<text x="34" y="600">fields filtered, not re-validated</text>
</g>
<g font-size="17" font-weight="700">
<text x="394" y="104">404 "Not Found"</text>
<text x="394" y="195">422 json_invalid</text>
<text x="394" y="283">422, every error at once</text>
<text x="394" y="408">404 "Recipe not found"</text>
<text x="394" y="468">500 Internal Server Error</text>
<text x="394" y="556" fill="#2a6a47">200 · 201 · 204</text>
</g>
<g font-size="16" fill="#535c6b">
