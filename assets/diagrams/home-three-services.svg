<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" role="img" aria-labelledby="t d">
  <title id="t">One product, three application services</title>
  <desc id="d">The browser opens the frontend on port 8501. The frontend calls the backend on port 8000. The backend calls the AI service on port 8001 and is the only service that reads and commits the database. Dashed crossed arrows mark two calls that are not allowed: frontend to database and frontend to AI service. A note says that a database, Redis, proxy or monitoring container is infrastructure, not a third service.</desc>
  <defs>
    <marker id="go" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#1d4e89"/></marker>
    <marker id="no" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#9b2c2c"/></marker>
  </defs>
  <rect width="960" height="400" fill="#ffffff"/>
  <g font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" fill="#0f1e3a">
    <text x="20" y="40" font-size="24" font-weight="700">One product, three application services</text>

    <!-- Not allowed: frontend to AI service, routed over the top -->
    <path d="M316 120 V84 H848 V112" fill="none" stroke="#9b2c2c" stroke-width="3" stroke-dasharray="9 7" marker-end="url(#no)"/>
    <circle cx="582" cy="84" r="13" fill="#fbf3f2" stroke="#9b2c2c" stroke-width="2.5"/>
    <path d="M575 77 L589 91 M589 77 L575 91" stroke="#9b2c2c" stroke-width="2.5"/>
    <text x="604" y="74" font-size="18" fill="#9b2c2c">not allowed</text>

    <!-- Services -->
    <rect x="20" y="120" width="120" height="100" rx="6" fill="#f7f5ef" stroke="#3b4453" stroke-width="2"/>
    <text x="80" y="162" font-size="22" font-weight="700" text-anchor="middle">Browser</text>
    <text x="80" y="190" font-size="18" fill="#535c6b" text-anchor="middle">user's tab</text>

    <rect x="226" y="120" width="180" height="100" rx="6" fill="#f3f6fa" stroke="#1d4e89" stroke-width="2"/>
    <text x="316" y="152" font-size="22" font-weight="700" text-anchor="middle">Frontend</text>
    <text x="316" y="178" font-size="18" text-anchor="middle">browser UI</text>
    <text x="316" y="203" font-size="18" fill="#535c6b" text-anchor="middle">Streamlit, React…</text>

    <rect x="492" y="120" width="180" height="100" rx="6" fill="#f1f7f3" stroke="#2a6a47" stroke-width="2"/>
    <text x="582" y="152" font-size="22" font-weight="700" text-anchor="middle">Backend</text>
    <text x="582" y="178" font-size="18" text-anchor="middle">FastAPI + Pydantic</text>
    <text x="582" y="203" font-size="17" fill="#535c6b" text-anchor="middle">validates, owns data</text>

    <rect x="758" y="120" width="180" height="100" rx="6" fill="#eff6f6" stroke="#22616b" stroke-width="2"/>
    <text x="848" y="152" font-size="22" font-weight="700" text-anchor="middle">AI service</text>
    <text x="848" y="178" font-size="18" text-anchor="middle">Pydantic AI</text>
    <text x="848" y="203" font-size="17" fill="#535c6b" text-anchor="middle">returns a proposal</text>

    <!-- Allowed calls -->
    <g stroke="#1d4e89" stroke-width="3" fill="none" marker-end="url(#go)">
      <path d="M140 170 H221"/>
      <path d="M406 170 H487"/>
      <path d="M672 170 H753"/>
      <path d="M582 220 V291"/>
    </g>
    <g font-size="18" text-anchor="middle">
      <text x="183" y="160">opens</text>
      <text x="183" y="194" fill="#535c6b">:8501</text>
      <text x="449" y="160">calls</text>
      <text x="449" y="194" fill="#535c6b">:8000</text>
      <text x="715" y="160">calls</text>
      <text x="715" y="194" fill="#535c6b">:8001</text>
    </g>
    <text x="594" y="250" font-size="18">reads,</text>
    <text x="594" y="272" font-size="18">commits</text>

    <!-- Database: backend only -->
    <rect x="492" y="296" width="180" height="84" rx="6" fill="#f1f7f3" stroke="#2a6a47" stroke-width="2"/>
    <text x="582" y="331" font-size="22" font-weight="700" text-anchor="middle">Database</text>
    <text x="582" y="359" font-size="18" fill="#535c6b" text-anchor="middle">SQLite on a volume</text>

    <!-- Not allowed: frontend to database -->
    <path d="M316 220 V338 H487" fill="none" stroke="#9b2c2c" stroke-width="3" stroke-dasharray="9 7" marker-end="url(#no)"/>
    <circle cx="402" cy="338" r="13" fill="#fbf3f2" stroke="#9b2c2c" stroke-width="2.5"/>
    <path d="M395 331 L409 345 M409 331 L395 345" stroke="#9b2c2c" stroke-width="2.5"/>
    <text x="402" y="312" font-size="18" fill="#9b2c2c" text-anchor="middle">not allowed</text>

    <!-- Legend -->
    <path d="M24 296 H70" stroke="#1d4e89" stroke-width="3" marker-end="url(#go)"/>
    <text x="80" y="302" font-size="18">sends requests</text>
    <path d="M24 338 H70" stroke="#9b2c2c" stroke-width="3" stroke-dasharray="9 7"/>
    <circle cx="47" cy="338" r="10" fill="#fbf3f2" stroke="#9b2c2c" stroke-width="2"/>
    <path d="M42 333 L52 343 M52 333 L42 343" stroke="#9b2c2c" stroke-width="2"/>
    <text x="80" y="344" font-size="18">not allowed</text>

    <!-- Infrastructure note -->
    <rect x="712" y="250" width="228" height="140" rx="6" fill="#f7f5ef" stroke="#ddd7ca" stroke-width="2"/>
    <text x="728" y="278" font-size="19" font-weight="700">Not a third service</text>
    <text x="728" y="304" font-size="18">A database, Redis,</text>
    <text x="728" y="328" font-size="18">proxy or monitoring</text>
    <text x="728" y="352" font-size="18">container is only</text>
    <text x="728" y="376" font-size="18">infrastructure.</text>
  </g>
</svg>
