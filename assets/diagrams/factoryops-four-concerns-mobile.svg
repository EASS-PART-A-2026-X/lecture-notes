<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 896" role="img" aria-labelledby="t d">
  <title id="t">FactoryOps map: propose, authorize, deliver, observe</title>
  <desc id="d">FactoryOps and Mission Control set scope, budget and stop rules throughout the process and read factory status and user outcomes. The software factory produces one candidate revision and checks. It proposes that evidence to a trusted human and repository gate. Only authorized deployment reaches the product, whose backend alone owns persistent data. The DevOps and platform layer runs both systems and enforces execution and delivery permissions. Feedback returns to Mission Control. This is the phone layout of the same four-concerns map, not a sequence in which operation starts only after delivery.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L11 6 L1 11 Z" fill="#3b4453"/></marker>
  </defs>
  <rect width="640" height="896" fill="#ffffff"/>
  <g font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" fill="#0f1e3a">
    <text x="24" y="43" font-size="32" font-weight="700">Build two systems. Operate both.</text>

    <rect x="24" y="76" width="592" height="120" rx="6" fill="#f3f6fa" stroke="#1d4e89" stroke-width="2"/>
    <text x="44" y="112" font-size="29" font-weight="700">FactoryOps / Mission Control</text>
    <text x="44" y="147" font-size="26">Set scope, budget and stop rules.</text>
    <text x="44" y="181" font-size="26">Read factory status and user outcomes.</text>
    <path d="M320 196 V240" fill="none" stroke="#3b4453" stroke-width="3" marker-end="url(#arrow)"/>
    <text x="340" y="226" font-size="24">direct the work</text>

    <rect x="24" y="244" width="592" height="120" rx="6" fill="#eff6f6" stroke="#22616b" stroke-width="2"/>
    <text x="44" y="282" font-size="30" font-weight="700">Software factory · build</text>
    <text x="44" y="318" font-size="26">Make one candidate revision.</text>
    <text x="44" y="351" font-size="26">Run checks; retain the evidence.</text>
    <path d="M320 364 V416" fill="none" stroke="#3b4453" stroke-width="3" marker-end="url(#arrow)"/>
    <text x="340" y="390" font-size="24">propose candidate</text>
    <text x="340" y="414" font-size="24">+ evidence</text>

    <rect x="24" y="420" width="592" height="100" rx="6" fill="#fbf6ec" stroke="#84540c" stroke-width="2"/>
    <text x="44" y="460" font-size="30" font-weight="700">Trusted delivery gate</text>
    <text x="44" y="498" font-size="26">Human approval + repository rules</text>
    <path d="M320 520 V576" fill="none" stroke="#3b4453" stroke-width="3" marker-end="url(#arrow)"/>
    <text x="340" y="549" font-size="24">authorize,</text>
    <text x="340" y="575" font-size="24">then deploy</text>

    <rect x="24" y="580" width="592" height="120" rx="6" fill="#f1f7f3" stroke="#2a6a47" stroke-width="2"/>
    <text x="44" y="618" font-size="30" font-weight="700">Product · build for users</text>
    <text x="44" y="653" font-size="26">Browser → backend → AI service</text>
    <text x="44" y="686" font-size="26">Only the backend owns the database.</text>

    <text x="24" y="743" font-size="25" font-weight="700">Feedback returns to Mission Control:</text>
    <text x="24" y="775" font-size="25">factory status + observed user outcomes.</text>

    <rect x="24" y="804" width="592" height="78" rx="6" fill="#f7f5ef" stroke="#ddd7ca" stroke-width="2"/>
    <text x="44" y="838" font-size="28" font-weight="700">DevOps / platform · supports both</text>
    <text x="44" y="867" font-size="24">Runs tools; enforces limits and permissions.</text>
  </g>
</svg>
