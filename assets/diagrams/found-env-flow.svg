<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 600" role="img" aria-labelledby="t d">
<title id="t">Where does a process get AI_MODEL?</title>
<desc id="d">The shell, with export AI_MODEL=from-shell, starts two commands and gives each a copy of its variables: uv run python show.py, and docker compose up. A .env file containing AI_MODEL=ollama:from-dotenv is plain text. uv reads it only when the command includes --env-file .env. Docker Compose reads the .env file next to compose.yaml automatically, but only to fill placeholders such as ${AI_MODEL:-test} in compose.yaml. Compose then sets the container's environment from the environment: and env_file: entries, and the container process sees only those. Rules: when the shell and the file both set a variable, the shell wins; when neither sets it, os.getenv returns its default, test; a child process gets a copy and can never change its parent's variables. Solid arrows copy variables into a new process; dashed arrows are a tool reading the file.</desc>
<defs>
<marker id="an" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L9 5 L1 9 Z" fill="#1d4e89"/></marker>
<marker id="ao" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L9 5 L1 9 Z" fill="#84540c"/></marker>
</defs>
<rect width="640" height="600" fill="#ffffff"/>
<g font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" fill="#0f1e3a" text-anchor="middle">
<text x="320" y="28" font-size="20" font-weight="700">Where does a process get AI_MODEL?</text>
<text x="320" y="52" font-size="16" fill="#535c6b">Solid arrow: a new process gets a copy. Dashed arrow: a tool reads the file.</text>
<rect x="16" y="68" width="608" height="64" rx="6" fill="#f3f6fa" stroke="#1d4e89" stroke-width="2"/>
<text x="320" y="94" font-size="18" font-weight="700" fill="#1d4e89">Your terminal (the shell)</text>
<text x="320" y="118" font-size="16">export AI_MODEL=from-shell</text>
<path d="M46 132 V322" stroke="#1d4e89" stroke-width="2.5" fill="none" marker-end="url(#an)"/>
<text x="56" y="164" font-size="16" fill="#1d4e89" text-anchor="start">starts it with a copy</text>
<path d="M610 132 V322" stroke="#1d4e89" stroke-width="2.5" fill="none" marker-end="url(#an)"/>
<text x="600" y="164" font-size="16" fill="#1d4e89" text-anchor="end">starts it with a copy</text>
<rect x="200" y="184" width="240" height="66" rx="6" fill="#fbf6ec" stroke="#84540c" stroke-width="2"/>
<text x="320" y="210" font-size="18" font-weight="700" fill="#84540c">.env file: plain text</text>
<text x="320" y="235" font-size="16">AI_MODEL=ollama:from-dotenv</text>
<path d="M232 250 L206 320" stroke="#84540c" stroke-width="2.5" stroke-dasharray="7 5" fill="none" marker-end="url(#ao)"/>
<text x="200" y="278" font-size="16" fill="#84540c" text-anchor="end">read only with</text>
<text x="200" y="298" font-size="16" fill="#84540c" text-anchor="end">--env-file .env</text>
<path d="M408 250 L434 320" stroke="#84540c" stroke-width="2.5" stroke-dasharray="7 5" fill="none" marker-end="url(#ao)"/>
<text x="442" y="278" font-size="16" fill="#84540c" text-anchor="start">read automatically,</text>
<text x="442" y="298" font-size="16" fill="#84540c" text-anchor="start">only to fill ${…}</text>
<rect x="16" y="326" width="276" height="76" rx="6" fill="#f7f5ef" stroke="#3b4453" stroke-width="2"/>
<text x="154" y="354" font-size="18" font-weight="700">uv run python show.py</text>
<text x="154" y="380" font-size="16">os.getenv reads its own copy</text>
<rect x="348" y="326" width="276" height="76" rx="6" fill="#f7f5ef" stroke="#3b4453" stroke-width="2"/>
<text x="486" y="354" font-size="18" font-weight="700">docker compose up</text>
<text x="486" y="380" font-size="16">fills ${AI_MODEL:-test}</text>
<path d="M486 402 V446" stroke="#1d4e89" stroke-width="2.5" fill="none" marker-end="url(#an)"/>
<text x="496" y="430" font-size="16" fill="#1d4e89" text-anchor="start">sets environment:</text>
<rect x="348" y="450" width="276" height="56" rx="6" fill="#f7f5ef" stroke="#3b4453" stroke-width="2"/>
<text x="486" y="474" font-size="18" font-weight="700">Container process</text>
<text x="486" y="496" font-size="16">no copy of your shell</text>
<rect x="16" y="420" width="276" height="86" rx="6" fill="#ffffff" stroke="#ddd7ca" stroke-width="2"/>
<text x="28" y="446" font-size="16" text-anchor="start">No --env-file? The file is</text>
<text x="28" y="468" font-size="16" text-anchor="start">ignored: without the export,</text>
<text x="28" y="490" font-size="16" text-anchor="start">the process sees test.</text>
<rect x="16" y="522" width="608" height="66" rx="6" fill="#f1f7f3" stroke="#2a6a47" stroke-width="2"/>
<text x="320" y="548" font-size="18" font-weight="700" fill="#2a6a47">Shell and file both set it? The shell wins: from-shell.</text>
<text x="320" y="572" font-size="16">A child gets a copy; it can never change its parent's variables.</text>
</g>
</svg>
