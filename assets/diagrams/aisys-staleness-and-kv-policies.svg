<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" role="img" aria-labelledby="t d">
  <title id="t">Async RL staleness, Kimi k1.5 partial rollouts, and KV mismatch</title>
  <desc id="d">Top band shows a learner stepping policy weights every 15 seconds while one 90-second coding rollout falls 6 updates behind, contrasted with Kimi k1.5 partial rollouts pausing into a replay buffer at 45 seconds and finishing cleanly next round. Bottom band shows KV mismatch when weights change mid-rollout and lists the six KV consistency rules.</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L8 4.5 L1 8 Z" fill="#3b4453"/></marker>
  </defs>
  <rect width="960" height="480" fill="#ffffff"/>
  <g font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" fill="#0f1e3a">
    <text x="480" y="32" text-anchor="middle" font-size="22" font-weight="700">Async RL staleness, partial rollouts, and KV mismatch</text>
    <text x="480" y="56" text-anchor="middle" font-size="15" fill="#535c6b">Faster training GPUs age slow coding trajectories&#x2014;here is how schedulers and engines handle it.</text>

    <!-- Band 1: Timeline -->
    <rect x="24" y="76" width="912" height="202" rx="8" fill="#fbf6ec" stroke="#84540c" stroke-width="2"/>
    <text x="44" y="102" font-size="16" font-weight="700" fill="#84540c">1. Why doubling training GPUs makes rollouts staler (15s weight steps vs. 90s test run)</text>

    <!-- Learner weight boxes -->
    <text x="44" y="138" font-size="13" font-weight="700">Learner weights:</text>
    <g text-anchor="middle" font-size="13" font-weight="700">
      <rect x="172" y="118" width="94" height="30" rx="5" fill="#1d4e89"/><text x="219" y="138" fill="#ffffff">&#x3B8;_10 (0s)</text>
      <rect x="276" y="118" width="94" height="30" rx="5" fill="#1d4e89"/><text x="323" y="138" fill="#ffffff">&#x3B8;_11 (15s)</text>
      <rect x="380" y="118" width="94" height="30" rx="5" fill="#1d4e89"/><text x="427" y="138" fill="#ffffff">&#x3B8;_12 (30s)</text>
      <rect x="484" y="118" width="94" height="30" rx="5" fill="#1d4e89"/><text x="531" y="138" fill="#ffffff">&#x3B8;_13 (45s)</text>
      <rect x="588" y="118" width="94" height="30" rx="5" fill="#1d4e89"/><text x="635" y="138" fill="#ffffff">&#x3B8;_14 (60s)</text>
      <rect x="692" y="118" width="94" height="30" rx="5" fill="#1d4e89"/><text x="739" y="138" fill="#ffffff">&#x3B8;_15 (75s)</text>
      <rect x="796" y="118" width="94" height="30" rx="5" fill="#9b2c2c"/><text x="843" y="138" fill="#ffffff">&#x3B8;_16 (90s)</text>
    </g>

    <!-- Full 90s stale rollout -->
    <text x="44" y="182" font-size="13" font-weight="700" fill="#9b2c2c">Continuous try:</text>
    <rect x="172" y="162" width="548" height="30" rx="5" fill="#fbf3f2" stroke="#9b2c2c" stroke-width="1.5"/>
    <text x="446" y="182" text-anchor="middle" font-size="13" font-weight="700" fill="#9b2c2c">90s coding rollout (started on &#x3B8;_10, finishes when learner is on &#x3B8;_16)</text>
    <rect x="730" y="162" width="188" height="30" rx="15" fill="#9b2c2c"/>
    <text x="824" y="182" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">Lag = 6 updates (stale!)</text>

    <!-- Kimi k1.5 partial rollout -->
    <text x="44" y="230" font-size="13" font-weight="700" fill="#2a6a47">Kimi k1.5 partial:</text>
    <rect x="172" y="210" width="224" height="30" rx="5" fill="#eff6f6" stroke="#22616b" stroke-width="1.5"/>
    <text x="284" y="230" text-anchor="middle" font-size="13" font-weight="700" fill="#22616b">Segment 1 (0&#x2013;45s)</text>
    <path d="M396 225 H422" fill="none" stroke="#3b4453" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="428" y="210" width="150" height="30" rx="5" fill="#ffffff" stroke="#84540c" stroke-width="1.5"/>
    <text x="503" y="230" text-anchor="middle" font-size="13" font-weight="700" fill="#84540c">Save to replay buffer</text>
    <path d="M578 225 H604" fill="none" stroke="#3b4453" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="610" y="210" width="308" height="30" rx="5" fill="#f1f7f3" stroke="#2a6a47" stroke-width="1.5"/>
    <text x="764" y="230" text-anchor="middle" font-size="13" font-weight="700" fill="#2a6a47">Finish in next round (no dropped tasks)</text>
    <text x="480" y="264" text-anchor="middle" font-size="12" fill="#535c6b">Bounded async queues (AReaL) and partial rollouts (Kimi k1.5) avoid selection bias against slow hard problems.</text>

    <!-- Band 2: KV Cache Hazard & Six Policies -->
    <rect x="24" y="294" width="912" height="166" rx="8" fill="#f3f6fa" stroke="#1d4e89" stroke-width="2"/>
    <text x="44" y="320" font-size="16" font-weight="700" fill="#1d4e89">2. Weight sync + KV mismatch hazard (pick one explicit KV policy)</text>

    <rect x="44" y="336" width="176" height="36" rx="6" fill="#ffffff" stroke="#1d4e89" stroke-width="1.5"/>
    <text x="132" y="359" text-anchor="middle" font-size="13" font-weight="700">&#x3B8;_10 builds KV_10</text>
    <path d="M220 354 H260" fill="none" stroke="#3b4453" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="266" y="336" width="196" height="36" rx="6" fill="#fbf6ec" stroke="#84540c" stroke-width="1.5"/>
    <text x="364" y="359" text-anchor="middle" font-size="13" font-weight="700" fill="#84540c">Learner pushes &#x3B8;_11</text>
    <path d="M462 354 H502" fill="none" stroke="#3b4453" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="508" y="336" width="408" height="36" rx="6" fill="#fbf3f2" stroke="#9b2c2c" stroke-width="1.5"/>
    <text x="712" y="359" text-anchor="middle" font-size="13" font-weight="700" fill="#9b2c2c">KV mismatch shifts &#x3C0;_old &#x2192; &#x3C1;_t drifts unless handled!</text>

    <!-- 6 Policy Pills -->
    <g text-anchor="middle" font-size="12" font-weight="700">
      <rect x="44" y="394" width="136" height="44" rx="6" fill="#ffffff" stroke="#22616b" stroke-width="1.5"/>
      <text x="112" y="414" fill="#22616b">1. Flush KV</text><text x="112" y="430" font-size="11" font-weight="400" fill="#535c6b">Cleanest parity</text>

      <rect x="192" y="394" width="136" height="44" rx="6" fill="#ffffff" stroke="#22616b" stroke-width="1.5"/>
      <text x="260" y="414" fill="#22616b">2. Pin to &#x3B8;_10</text><text x="260" y="430" font-size="11" font-weight="400" fill="#535c6b">Finish current try</text>

      <rect x="340" y="394" width="136" height="44" rx="6" fill="#ffffff" stroke="#22616b" stroke-width="1.5"/>
      <text x="408" y="414" fill="#22616b">3. Recompute KV</text><text x="408" y="430" font-size="11" font-weight="400" fill="#535c6b">Exact, extra prefill</text>

      <rect x="488" y="394" width="136" height="44" rx="6" fill="#ffffff" stroke="#84540c" stroke-width="1.5"/>
      <text x="556" y="414" fill="#84540c">4. Multi-version</text><text x="556" y="430" font-size="11" font-weight="400" fill="#535c6b">Uses more GPU RAM</text>

      <rect x="636" y="394" width="136" height="44" rx="6" fill="#ffffff" stroke="#84540c" stroke-width="1.5"/>
      <text x="704" y="414" fill="#84540c">5. Retain KV</text><text x="704" y="430" font-size="11" font-weight="400" fill="#535c6b">Fast, approximate</text>

      <rect x="784" y="394" width="132" height="44" rx="6" fill="#ffffff" stroke="#1d4e89" stroke-width="1.5"/>
      <text x="850" y="414" fill="#1d4e89">6. Translate KV</text><text x="850" y="430" font-size="11" font-weight="400" fill="#535c6b">Must log exact &#x3C0;_old</text>
    </g>
  </g>
</svg>
