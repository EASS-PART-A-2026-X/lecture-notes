[project]
name = "recipe-box-frontend"
version = "0.1.0"
requires-python = ">=3.14,<3.15"
dependencies = ['streamlit==1.66.0', 'httpx==0.28.1']

[dependency-groups]
dev = ["pytest==9.1.1", "respx==0.23.1"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
filterwarnings = ["error"]
