[project]
name = "recipe-box-backend"
version = "0.1.0"
requires-python = ">=3.14,<3.15"
dependencies = ['fastapi[standard]==0.143.3', 'sqlmodel==0.0.48', 'httpx2==2.13.1', 'tenacity==9.1.4']

[dependency-groups]
dev = ["pytest==9.1.1"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
filterwarnings = ["error"]

[tool.fastapi]
entrypoint = "app.main:app"
