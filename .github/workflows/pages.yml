# Builds the course website (Jekyll + Just the Docs) and the course PDF, then publishes both to GitHub Pages.
# Needs Settings → Pages → Build and deployment → Source: "GitHub Actions".
name: Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions: {} # each job asks for what it needs

# PR checks run independently; let a running main deployment finish.
concurrency:
  group: pages-${{ github.event.pull_request.number || 'deploy' }}
  cancel-in-progress: false

jobs:
  build:
    name: Build website and PDF
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read # check out the repository
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ruby/setup-ruby@651ff0d62c5c79bed6d53ec518387aae20e72c1a # v1.329.0
        with:
          ruby-version: "3.4"
          bundler-cache: true

      - name: Build the website
        run: bundle exec jekyll build --strict_front_matter
        env:
          JEKYLL_ENV: production

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.1"
          enable-cache: false

      - name: Install Chromium for Playwright
        run: uv run .github/scripts/build_pdf.py install

      - name: Build the course PDF
        run: uv run .github/scripts/build_pdf.py _site "$BASE_URL"
        env:
          BASE_URL: https://eass-part-a-2026-x.github.io/lecture-notes

      - name: Test the site checker
        run: python3 -m unittest discover -s .github/scripts -p 'test_*.py'

      - name: Check local links, anchors and assets
        run: python3 .github/scripts/check_site.py _site https://eass-part-a-2026-x.github.io/lecture-notes

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        if: github.event_name != 'pull_request'

  deploy:
    name: Deploy to GitHub Pages
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write # publish the uploaded artifact
      id-token: write # prove to Pages that this run is the deployer
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
