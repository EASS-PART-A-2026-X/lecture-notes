# Just the Docs
color_scheme: eass # _sass/color_schemes/eass.scss: ink navy on white, warm paper; oxblood only for deadlines and failures
search:
  heading_level: 3
  previews: 2
  rel_url: false # no tiny URL line under each result; titles and previews identify the page
heading_anchors: true
enable_copy_code_button: true
back_to_top: true
back_to_top_text: Back to top
# aux_links are printed as-is (no baseurl), so the PDF path includes /lecture-notes.
aux_links:
  Download the course PDF: [/lecture-notes/EASS-Class-X-course.pdf]
  GitHub repository: [https://github.com/EASS-PART-A-2026-X/lecture-notes]

# Hide the theme's own Dart Sass deprecation warnings so real build problems stand out.
sass:
  quiet_deps: true
  silence_deprecations: [import]
  sourcemap: never
